<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3e5c3a">
<title>Unser Stammbaum</title>
<style>
  :root {
    --bg: #f4ecd8; --paper: #fffaf0; --ink: #3b2f22; --muted: #7a6a55;
    --green: #3e5c3a; --green2: #56794f; --gold: #c99a2e;
    --m-bg: #dde9f5; --m-bd: #4a78a8;
    --w-bg: #f8e1e6; --w-bd: #b45a72;
    --u-bg: #eee7d6; --u-bd: #8a7a5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; cursor: pointer; }

  header { background: var(--green); color: #fff; display: flex; align-items: center;
    gap: 6px; padding: 8px 10px; padding-top: max(8px, env(safe-area-inset-top)); }
  header h1 { font-family: Georgia, serif; font-size: 1.25rem; margin: 0 auto 0 4px; font-weight: normal; }
  header button { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25);
    border-radius: 10px; padding: 8px 11px; font-size: .95rem; }
  header button.active { background: #fff; color: var(--green); }
  @media (max-width: 480px) {
    header h1 { font-size: 1.05rem; } header h1 .long { display: none; }
    header button { padding: 7px 9px; font-size: .9rem; }
  }

  main { flex: 1; position: relative; overflow: hidden; }
  #treeView, #listView { position: absolute; inset: 0; }
  #tree { width: 100%; height: 100%; touch-action: none; display: block;
    background: radial-gradient(circle at 50% 40%, #fbf5e6 0%, var(--bg) 70%); }

  .card rect.box { stroke-width: 2; filter: drop-shadow(0 2px 3px rgba(60,40,20,.18)); }
  .card.g-m rect.box { fill: var(--m-bg); stroke: var(--m-bd); }
  .card.g-w rect.box { fill: var(--w-bg); stroke: var(--w-bd); }
  .card.g-u rect.box, .card.g-d rect.box { fill: var(--u-bg); stroke: var(--u-bd); }
  .card.focus rect.box { stroke: var(--gold); stroke-width: 4; }
  .card text { fill: var(--ink); pointer-events: none; }
  .t-first { font: 600 15px Georgia, serif; }
  .t-last { font: 14px Georgia, serif; }
  .t-life { font: 12px system-ui, sans-serif; fill: var(--muted) !important; }
  .t-lock { font-size: 12px; }
  .ghost rect { fill: rgba(255,255,255,.45); stroke: var(--muted); stroke-dasharray: 6 5; stroke-width: 1.5; }
  .ghost text { fill: var(--muted); font: 14px system-ui, sans-serif; pointer-events: none; }
  .line { fill: none; stroke: #8b7355; stroke-width: 2; }
  .marry { font: 16px Georgia, serif; fill: var(--gold); }

  .zoom { position: absolute; left: 10px; bottom: calc(14px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 6px; }
  .zoom button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid #c8b895;
    background: var(--paper); font-size: 1.3rem; color: var(--green); box-shadow: 0 2px 4px rgba(0,0,0,.12); }

  #fab { position: absolute; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom));
    background: var(--green); color: #fff; border: none; border-radius: 28px; padding: 14px 20px;
    font-size: 1.05rem; box-shadow: 0 3px 8px rgba(0,0,0,.25); }

  #emptyHint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; }
  #emptyHint .box { background: var(--paper); border-radius: 16px; padding: 24px; max-width: 420px;
    text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.12); }
  #emptyHint h2 { font-family: Georgia, serif; margin-top: 0; }

  #listView { overflow-y: auto; padding: 12px; padding-bottom: 90px; }
  #search { width: 100%; padding: 12px; font-size: 1rem; border-radius: 12px; border: 1px solid #c8b895; background: var(--paper); }
  .count { color: var(--muted); margin: 8px 4px; font-size: .9rem; }
  .row { display: flex; align-items: center; gap: 12px; background: var(--paper); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 8px; border-left: 5px solid var(--u-bd); cursor: pointer; }
  .row.g-m { border-left-color: var(--m-bd); } .row.g-w { border-left-color: var(--w-bd); }
  .row .nm { font-family: Georgia, serif; font-size: 1.05rem; }
  .row .sub { color: var(--muted); font-size: .85rem; }
  .avatar { width: 46px; height: 46px; border-radius: 50%; flex: none; object-fit: cover;
    display: flex; align-items: center; justify-content: center; font-family: Georgia, serif;
    font-size: 1.2rem; color: #fff; background: var(--u-bd); }
  .avatar.g-m { background: var(--m-bd); } .avatar.g-w { background: var(--w-bd); }

  /* Detail-Ansicht */
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 78vh; background: var(--paper);
    border-radius: 18px 18px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,.22); overflow-y: auto;
    z-index: 20; padding: 0 16px calc(20px + env(safe-area-inset-bottom)); }
  @media (min-width: 900px) {
    #sheet { left: auto; top: 60px; width: 400px; max-height: none; border-radius: 18px 0 0 0; }
  }
  .sheet-head { position: sticky; top: 0; background: var(--paper); display: flex; gap: 12px;
    align-items: center; padding: 16px 0 10px; border-bottom: 1px solid #eadfc4; }
  .sheet-head .avatar { width: 64px; height: 64px; font-size: 1.6rem; }
  .sheet-head h2 { font-family: Georgia, serif; margin: 0; font-size: 1.3rem; }
  .sheet-head .sub { color: var(--muted); font-size: .9rem; }
  .close { margin-left: auto; align-self: flex-start; background: none; border: none; font-size: 1.6rem; color: var(--muted); padding: 4px 8px; }
  h3 { font-family: Georgia, serif; font-size: 1rem; color: var(--green); margin: 16px 0 6px; }
  .facts { width: 100%; border-collapse: collapse; }
  .facts td { padding: 4px 0; vertical-align: top; }
  .facts td:first-child { color: var(--muted); width: 90px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: #efe6cf; border: 1px solid #d8c9a3; border-radius: 16px; padding: 6px 12px; font-size: .92rem; color: var(--ink); }
  .chip.g-m { background: var(--m-bg); border-color: #a9c1dc; } .chip.g-w { background: var(--w-bg); border-color: #e0b1bf; }
  .note { white-space: pre-wrap; background: #f8f1df; border-radius: 10px; padding: 10px; }
  .note a { color: var(--green); word-break: break-all; }
  .research { border-radius: 12px; padding: 12px; margin-top: 14px; font-size: .92rem; }
  .research.locked { background: #f3e3e0; border: 1px solid #dcb3ab; }
  .research.open { background: #e5efe0; border: 1px solid #b2c9a7; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
  .btn { background: #efe6cf; border: 1px solid #d0bf96; border-radius: 12px; padding: 11px 10px; color: var(--ink); font-size: .95rem; }
  .btn.primary { background: var(--green); color: #fff; border-color: var(--green); }
  .btn.danger { background: #fff; color: #a33; border-color: #d9a3a3; }
  .btn.wide { grid-column: 1 / -1; }

  /* Fenster für Formulare */
  #modal { position: fixed; inset: 0; background: rgba(40,30,20,.45); z-index: 30; display: flex;
    align-items: flex-end; justify-content: center; }
  @media (min-width: 700px) { #modal { align-items: center; } }
  .dialog { background: var(--paper); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
    border-radius: 18px 18px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom)); }
  @media (min-width: 700px) { .dialog { border-radius: 18px; } }
  .dialog h2 { font-family: Georgia, serif; margin: 0 0 12px; }
  .dialog label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 4px; }
  .dialog input, .dialog select, .dialog textarea { width: 100%; padding: 11px; font-size: 1rem;
    border-radius: 10px; border: 1px solid #c8b895; background: #fff; color: var(--ink); font-family: inherit; }
  .dialog textarea { min-height: 80px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hint { font-size: .82rem; color: var(--muted); margin-top: 4px; }
  .menu-list { display: flex; flex-direction: column; gap: 8px; }
  .menu-list .btn { text-align: left; padding: 14px; }
  .privacy { background: #e5efe0; border-radius: 12px; padding: 12px; font-size: .9rem; margin-bottom: 14px; }
  .partner-row { display: flex; align-items: center; justify-content: space-between; background: #f3ead4; border-radius: 10px; padding: 6px 10px; margin-bottom: 6px; }
  .partner-row button { background: none; border: none; color: #a33; font-size: 1.1rem; }
  [hidden] { display: none !important; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; padding: 10px 4px; border-radius: 10px; border: 1px solid #c8b895; background: #fff; color: var(--ink); font-size: .95rem; }
  .seg button.on { background: var(--green); border-color: var(--green); color: #fff; }
  .two.dates { grid-template-columns: 1.15fr 1fr; }
  .datewrap { display: flex; gap: 6px; position: relative; }
  .datewrap input[name] { flex: 1; min-width: 0; }
  .calbtn { flex: none; width: 46px; border-radius: 10px; border: 1px solid #c8b895; background: #fff; font-size: 1.2rem; }
  .hiddendate { position: absolute; right: 0; bottom: 0; width: 46px !important; height: 1px; opacity: 0; pointer-events: none; padding: 0 !important; border: 0 !important; }
  .datehint { font-size: .8rem; color: var(--green2); min-height: 1.1em; margin-top: 3px; }
  .datehint.free { color: var(--muted); }
  .voicebtn { width: 100%; margin-bottom: 4px; background: #e5efe0; border-color: #b2c9a7; font-weight: 600; }
  .voice { background: #f3ecd9; border-radius: 12px; padding: 10px; margin-bottom: 6px; }
  .voice textarea { min-height: 70px; margin: 8px 0; }
  .voice .btn.rec { background: #b03a3a; color: #fff; border-color: #b03a3a; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .7; } }
  .flash { animation: flash 2.5s ease-out; }
  @keyframes flash { 0% { background: #fde68a; } 100% { background: #fff; } }
  details.more { margin-top: 16px; border-top: 1px solid #eadfc4; padding-top: 6px; }
  details.more summary { cursor: pointer; color: var(--green); font-weight: 600; padding: 8px 0; }
</style>
</head>
<body>
<header>
  <h1>🌳 <span class="long">Unser </span>Stammbaum</h1>
  <button id="btnTree" class="active">Baum</button>
  <button id="btnList">Liste</button>
  <button id="btnHome" title="Zur Startperson">🏠</button>
  <button id="btnMenu" title="Menü">☰</button>
</header>
<main>
  <section id="treeView">
    <svg id="tree"><g id="viewport"></g></svg>
    <div class="zoom">
      <button id="zoomIn" aria-label="Vergrößern">＋</button>
      <button id="zoomOut" aria-label="Verkleinern">－</button>
      <button id="zoomFit" aria-label="Einpassen">⤢</button>
    </div>
    <div id="emptyHint" hidden>
      <div class="box">
        <h2>Willkommen! 👋</h2>
        <p>Hier entsteht euer Familien-Stammbaum. Fang mit einer Person an – zum Beispiel mit dir selbst oder einem Großelternteil.</p>
        <p><button class="btn primary" id="btnFirst">＋ Erste Person anlegen</button></p>
        <p><button class="btn" id="btnDemo">👪 Beispiel-Familie ansehen</button></p>
        <p class="hint">Alle Daten bleiben nur auf diesem Gerät.</p>
      </div>
    </div>
  </section>
  <section id="listView" hidden>
    <input id="search" type="search" placeholder="🔍 Name, Ort oder Jahr suchen …">
    <div class="count" id="count"></div>
    <div id="list"></div>
  </section>
  <button id="fab">＋ Person</button>
</main>
<div id="sheet" hidden></div>
<div id="modal" hidden></div>
<input type="file" id="fileInput" hidden>

<script>
'use strict';
// ====================== Einstellungen ======================
const CW = 170, CH = 84;          // Größe einer Personen-Karte
const HG = 28, VG = 66;           // Abstand waagerecht / senkrecht
const MAX_ANCESTOR_GENS = 3;      // wie viele Generationen nach oben (Eltern, Großeltern, Urgroßeltern)
const MAX_DESC_GENS = 2;          // wie viele Generationen nach unten (Kinder, Enkel)
const PROTECT_YEARS = 100;        // jünger als so viele Jahre = geschützt
const STORE_KEY = 'stammbaum-daten-v1';
const THIS_YEAR = new Date().getFullYear();

// ====================== Daten ======================
let data = load();
function emptyData() { return { version: 1, persons: {}, rootId: null, focusId: null }; }
function load() {
  try { const d = JSON.parse(localStorage.getItem(STORE_KEY)); if (d && d.persons) return d; } catch (e) {}
  return emptyData();
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
  catch (e) { alert('Speichern hat nicht geklappt – der Speicher ist voll. Bitte einige Fotos entfernen und eine Sicherung machen.'); }
}
function uid() { return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
const P = id => (id ? data.persons[id] : undefined);
function newPerson(o = {}) {
  return Object.assign({ id: uid(), firstName: '', lastName: '', birthName: '', gender: 'u', status: 'unbekannt',
    birthDate: '', birthPlace: '', deathDate: '', deathPlace: '', occupation: '', notes: '', sources: '',
    photo: '', father: null, mother: null, spouses: [] }, o);
}

// ====================== Hilfsfunktionen ======================
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function yearOf(s) { const m = String(s || '').match(/\b(\d{4})\b/); return m ? +m[1] : null; }
function fullName(p) { return [p.firstName, p.lastName].filter(Boolean).join(' ') || 'Unbekannt'; }
function trunc(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
function lifeSpan(p) {
  const b = yearOf(p.birthDate), d = yearOf(p.deathDate); const parts = [];
  if (b) parts.push('* ' + b);
  if (d) parts.push('† ' + d); else if (p.status === 'verstorben') parts.push('†');
  return parts.join('   ');
}
function byBirth(a, b) { return (yearOf(a.birthDate) || 9999) - (yearOf(b.birthDate) || 9999); }
function childrenOf(id) { return Object.values(data.persons).filter(c => c.father === id || c.mother === id).sort(byBirth); }
function siblingsOf(p) {
  if (!p.father && !p.mother) return [];
  return Object.values(data.persons).filter(s => s.id !== p.id &&
    ((p.father && s.father === p.father) || (p.mother && s.mother === p.mother))).sort(byBirth);
}
function sortedPersons() {
  return Object.values(data.persons).sort((a, b) =>
    (a.lastName + ' ' + a.firstName).localeCompare(b.lastName + ' ' + b.firstName, 'de'));
}
// Schutz: Lebende und alle, die jünger als 100 Jahre sind (oder bei denen es unklar ist)
function isProtected(p) {
  const by = yearOf(p.birthDate), dy = yearOf(p.deathDate);
  if (p.status === 'lebt') return true;
  if (by) return by > THIS_YEAR - PROTECT_YEARS;
  if (dy && dy <= THIS_YEAR - 30) return false;
  return true;
}
function linkify(text) {
  return esc(text).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function avatarHTML(p) {
  if (p.photo) return `<img class="avatar" src="${esc(p.photo)}" alt="">`;
  return `<div class="avatar g-${p.gender}">${esc((p.firstName || p.lastName || '?')[0].toUpperCase())}</div>`;
}

// ====================== Baum zeichnen ======================
const svg = document.getElementById('tree');
const vp = document.getElementById('viewport');
let view = { x: 0, y: 0, k: 1 };
let lastBox = null;

function applyView() { vp.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`); }

function renderTree(fit) {
  const ids = Object.keys(data.persons);
  document.getElementById('emptyHint').hidden = ids.length > 0;
  document.getElementById('fab').hidden = ids.length === 0;
  if (!ids.length) { vp.innerHTML = ''; return; }
  if (!P(data.focusId)) data.focusId = P(data.rootId) ? data.rootId : ids[0];
  if (!P(data.rootId)) data.rootId = data.focusId;

  const f = P(data.focusId);
  const rowH = CH + VG, step = CW + HG;
  const nodes = [], ghosts = [], lines = [], marks = [];

  // --- Vorfahren (nach oben) ---
  const anc = [[f.id]]; let maxG = 0;
  for (let g = 1; g <= MAX_ANCESTOR_GENS; g++) {
    const row = []; let any = false;
    for (const cid of anc[g - 1]) {
      const c = P(cid);
      const fa = c && P(c.father) ? c.father : null, mo = c && P(c.mother) ? c.mother : null;
      row.push(fa, mo); if (fa || mo) any = true;
    }
    if (!any) break;
    anc.push(row); maxG = g;
  }
  const total = Math.pow(2, Math.max(maxG, 1)) * step;
  const slotX = (g, i) => (i + 0.5) * (total / Math.pow(2, g)) - total / 2;
  const pos = {};
  for (let g = 0; g <= maxG; g++) anc[g].forEach((id, i) => {
    if (!id) return; const x = slotX(g, i), y = -g * rowH;
    pos[g + ':' + i] = { x, y }; nodes.push({ id, x, y, focus: g === 0 });
  });
  for (let g = 1; g <= maxG; g++) for (let ci = 0; ci < anc[g - 1].length; ci++) {
    const c = pos[(g - 1) + ':' + ci]; if (!c) continue;
    const ps = [pos[g + ':' + (2 * ci)], pos[g + ':' + (2 * ci + 1)]].filter(Boolean); if (!ps.length) continue;
    const midY = c.y - CH / 2 - VG / 2; const xs = ps.map(p => p.x).concat(c.x);
    let d = `M${c.x},${c.y - CH / 2}V${midY}M${Math.min(...xs)},${midY}H${Math.max(...xs)}`;
    ps.forEach(p => d += `M${p.x},${midY}V${p.y + CH / 2}`);
    lines.push(d);
  }
  // Platzhalter für fehlende Eltern
  const ghostLine = (x) => lines.push(`M0,${-CH / 2}V${-CH / 2 - VG / 2}H${x}V${-rowH + CH / 2}`);
  if (!P(f.father)) { ghosts.push({ x: slotX(1, 0), y: -rowH, add: 'father', label: '＋ Vater' }); ghostLine(slotX(1, 0)); }
  if (!P(f.mother)) { ghosts.push({ x: slotX(1, 1), y: -rowH, add: 'mother', label: '＋ Mutter' }); ghostLine(slotX(1, 1)); }

  // --- Partner (rechts daneben) ---
  const spouses = (f.spouses || []).filter(id => P(id));
  spouses.forEach((sid, j) => {
    const x = (j + 1) * step; nodes.push({ id: sid, x, y: 0 });
    lines.push(`M${j * step + CW / 2},0H${x - CW / 2}`);
    marks.push({ x: j * step + CW / 2 + HG / 2, y: -6 });
  });
  if (!spouses.length) ghosts.push({ x: step, y: 0, add: 'spouse', label: '＋ Partner/in' });

  // --- Nachkommen (nach unten) ---
  const descW = (id, depth) => {
    if (depth >= MAX_DESC_GENS) return step;
    const ch = childrenOf(id); if (!ch.length) return step;
    return Math.max(step, ch.reduce((s, c) => s + descW(c.id, depth + 1), 0));
  };
  const placeKids = (id, px, py, depth, startFn) => {
    if (depth >= MAX_DESC_GENS) return;
    const ch = childrenOf(id); if (!ch.length) return;
    const tot = ch.reduce((s, c) => s + descW(c.id, depth + 1), 0);
    let left = px - tot / 2; const y = py + rowH, midY = y - CH / 2 - VG / 2;
    ch.forEach(c => {
      const w = descW(c.id, depth + 1), x = left + w / 2; left += w;
      nodes.push({ id: c.id, x, y });
      const s = startFn(c); lines.push(`M${s.x},${s.y}V${midY}H${x}V${y - CH / 2}`);
      placeKids(c.id, x, y, depth + 1, () => ({ x, y: y + CH / 2 }));
    });
  };
  const gapX = j => j * step + CW / 2 + HG / 2;
  const focusStart = c => {
    const other = c.father === f.id ? c.mother : c.father; const j = spouses.indexOf(other);
    return j >= 0 ? { x: gapX(j), y: 0 } : { x: 0, y: CH / 2 };
  };
  const kids = childrenOf(f.id);
  let kx = 0;
  if (kids.length && spouses.length) {
    const js = new Set(kids.map(c => spouses.indexOf(c.father === f.id ? c.mother : c.father)));
    if (js.size === 1) { const j = [...js][0]; if (j >= 0) kx = gapX(j); }
  }
  placeKids(f.id, kx, 0, 0, focusStart);
  if (!kids.length) { ghosts.push({ x: 0, y: rowH, add: 'child', label: '＋ Kind' }); lines.push(`M0,${CH / 2}V${rowH - CH / 2}`); }

  // --- Zeichnen ---
  let out = lines.map(d => `<path class="line" d="${d}"/>`).join('');
  out += marks.map(m => `<text class="marry" x="${m.x}" y="${m.y}" text-anchor="middle">⚭</text>`).join('');
  out += ghosts.map(g => `<g class="ghost" data-add="${g.add}"><rect x="${g.x - CW / 2}" y="${g.y - CH / 2}" width="${CW}" height="${CH}" rx="12"/><text x="${g.x}" y="${g.y + 5}" text-anchor="middle">${g.label}</text></g>`).join('');
  out += nodes.map((n, i) => cardSVG(n, i)).join('');
  vp.innerHTML = out;

  const xs = nodes.concat(ghosts).map(n => n.x), ys = nodes.concat(ghosts).map(n => n.y);
  lastBox = { x1: Math.min(...xs) - CW / 2, x2: Math.max(...xs) + CW / 2, y1: Math.min(...ys) - CH / 2, y2: Math.max(...ys) + CH / 2 };
  if (fit) fitView(); else applyView();
}

function cardSVG(n, i) {
  const p = P(n.id), x = n.x - CW / 2, y = n.y - CH / 2;
  const hasPhoto = !!p.photo;
  const tx = hasPhoto ? x + 70 : n.x, anchor = hasPhoto ? 'start' : 'middle', max = hasPhoto ? 11 : 18;
  let s = `<g class="card g-${p.gender}${n.focus ? ' focus' : ''}" data-id="${p.id}">`;
  s += `<rect class="box" x="${x}" y="${y}" width="${CW}" height="${CH}" rx="12"/>`;
  if (hasPhoto) {
    s += `<clipPath id="cp${i}"><circle cx="${x + 36}" cy="${n.y}" r="27"/></clipPath>`;
    s += `<image href="${esc(p.photo)}" x="${x + 9}" y="${n.y - 27}" width="54" height="54" clip-path="url(#cp${i})" preserveAspectRatio="xMidYMid slice"/>`;
  }
  s += `<text class="t-first" x="${tx}" y="${n.y - 12}" text-anchor="${anchor}">${esc(trunc(p.firstName || '?', max))}</text>`;
  s += `<text class="t-last" x="${tx}" y="${n.y + 7}" text-anchor="${anchor}">${esc(trunc(p.lastName, max))}</text>`;
  s += `<text class="t-life" x="${tx}" y="${n.y + 27}" text-anchor="${anchor}">${esc(lifeSpan(p))}</text>`;
  if (isProtected(p)) s += `<text class="t-lock" x="${x + CW - 8}" y="${y + 17}" text-anchor="end">🔒</text>`;
  return s + '</g>';
}

function fitView() {
  if (!lastBox) return;
  const r = svg.getBoundingClientRect(), pad = 30;
  const bw = lastBox.x2 - lastBox.x1, bh = lastBox.y2 - lastBox.y1;
  view.k = Math.max(0.45, Math.min(1.1, Math.min((r.width - pad * 2) / bw, (r.height - pad * 2) / bh)));
  const fitsW = bw * view.k <= r.width - pad, fitsH = bh * view.k <= r.height - pad;
  const cx = fitsW ? (lastBox.x1 + lastBox.x2) / 2 : 0;
  const cy = fitsH ? (lastBox.y1 + lastBox.y2) / 2 : 0;
  view.x = r.width / 2 - cx * view.k; view.y = r.height / 2 - cy * view.k;
  applyView();
}
function zoomAt(factor, sx, sy) {
  const k = Math.max(0.2, Math.min(3, view.k * factor));
  const wx = (sx - view.x) / view.k, wy = (sy - view.y) / view.k;
  view.k = k; view.x = sx - wx * k; view.y = sy - wy * k; applyView();
}

// --- Verschieben, Zoomen und Antippen ---
const pointers = new Map(); let down = null, pinch = null;
svg.addEventListener('pointerdown', e => {
  svg.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) down = { x: e.clientX, y: e.clientY, target: e.target, moved: false, vx: view.x, vy: view.y };
  else if (pointers.size === 2) {
    if (down) down.moved = true;
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: view.k, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, vx: view.x, vy: view.y };
  }
});
svg.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const r = svg.getBoundingClientRect();
  if (pointers.size === 2 && pinch) {
    const [a, b] = [...pointers.values()];
    const k = Math.max(0.2, Math.min(3, pinch.k * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d));
    const wx = (pinch.mx - r.left - pinch.vx) / pinch.k, wy = (pinch.my - r.top - pinch.vy) / pinch.k;
    const mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
    view.k = k; view.x = mx - wx * k; view.y = my - wy * k; applyView();
  } else if (pointers.size === 1 && down) {
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (Math.hypot(dx, dy) > 7) down.moved = true;
    if (down.moved) { view.x = down.vx + dx; view.y = down.vy + dy; applyView(); }
  }
});
function pointerEnd(e) {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) {
    if (down && !down.moved && e.type === 'pointerup') {
      const card = down.target.closest && down.target.closest('[data-id]');
      const ghost = down.target.closest && down.target.closest('[data-add]');
      if (card) openDetail(card.dataset.id);
      else if (ghost) addRelative(data.focusId, ghost.dataset.add);
      else closeSheet();
    }
    down = null; pinch = null;
  } else if (pointers.size === 1) {
    const [p] = [...pointers.values()];
    pinch = null; down = { x: p.x, y: p.y, target: null, moved: true, vx: view.x, vy: view.y };
  }
}
svg.addEventListener('pointerup', pointerEnd);
svg.addEventListener('pointercancel', pointerEnd);
svg.addEventListener('wheel', e => {
  e.preventDefault(); const r = svg.getBoundingClientRect();
  zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
const zoomCenter = f => { const r = svg.getBoundingClientRect(); zoomAt(f, r.width / 2, r.height / 2); };
document.getElementById('zoomIn').onclick = () => zoomCenter(1.25);
document.getElementById('zoomOut').onclick = () => zoomCenter(0.8);
document.getElementById('zoomFit').onclick = fitView;
window.addEventListener('resize', () => applyView());

// ---- Datum: verschiedene Schreibweisen erkennen und einheitlich machen ----
const MONTHS_DE = ['januar', 'februar', 'märz', 'april', 'mai', 'juni', 'juli', 'august', 'september', 'oktober', 'november', 'dezember'];
function monthIndex(w) {
  w = w.toLowerCase().replace('ä', 'a').replace(/\.$/, '');
  return MONTHS_DE.findIndex(m => m.replace('ä', 'a').startsWith(w.slice(0, 3)) && w.length >= 3);
}
function normDate(s) {
  s = String(s || '').trim().replace(/\s+/g, ' '); if (!s) return '';
  const two = n => String(n).padStart(2, '0');
  const ok = (d, m, y) => d >= 1 && d <= 31 && m >= 1 && m <= 12 && y >= 1000 && y <= THIS_YEAR + 1;
  let m;
  if ((m = s.match(/^(?:um|ca\.?|circa|etwa|ungefähr|~)\s*(\d{4})$/i))) return 'um ' + m[1];
  if ((m = s.match(/^(vor|nach)\s*(\d{4})$/i))) return m[1].toLowerCase() + ' ' + m[2];
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)) && ok(+m[3], +m[2], +m[1])) return `${two(m[3])}.${two(m[2])}.${m[1]}`;
  if ((m = s.match(/^(\d{1,2})[.\s/-]+(\d{1,2})[.\s/-]+(\d{4})$/)) && ok(+m[1], +m[2], +m[3])) return `${two(m[1])}.${two(m[2])}.${m[3]}`;
  if ((m = s.match(/^(\d{2})(\d{2})(\d{4})$/)) && ok(+m[1], +m[2], +m[3])) return `${m[1]}.${m[2]}.${m[3]}`;
  if ((m = s.match(/^(\d{1,2})\.?\s*([a-zäA-ZÄ]{3,}\.?)\s*(\d{4})$/)) && monthIndex(m[2]) >= 0 && ok(+m[1], monthIndex(m[2]) + 1, +m[3])) return `${two(m[1])}.${two(monthIndex(m[2]) + 1)}.${m[3]}`;
  if ((m = s.match(/^([a-zäA-ZÄ]{3,}\.?)\s*(\d{4})$/)) && monthIndex(m[1]) >= 0) return `${two(monthIndex(m[1]) + 1)}.${m[2]}`;
  if ((m = s.match(/^(\d{1,2})[./](\d{4})$/)) && +m[1] >= 1 && +m[1] <= 12) return `${two(m[1])}.${m[2]}`;
  return s;
}
// Lesbare Anzeige, z. B. „17. Juni 1880“
function prettyDate(s) {
  let m; const M = MONTHS_DE.map(x => x[0].toUpperCase() + x.slice(1));
  if ((m = s.match(/^(\d{2})\.(\d{2})\.(\d{4})$/)) && +m[2] >= 1 && +m[2] <= 12 && +m[1] >= 1 && +m[1] <= 31) return `${+m[1]}. ${M[+m[2] - 1]} ${m[3]}`;
  if ((m = s.match(/^(\d{2})\.(\d{4})$/)) && +m[1] >= 1 && +m[1] <= 12) return `${M[+m[1] - 1]} ${m[2]}`;
  if (/^(\d{4}|um \d{4}|vor \d{4}|nach \d{4})$/.test(s)) return s;
  return null;
}
// Vorschläge aus den schon eingetragenen Personen (für weniger Tipparbeit)
function suggestions(fields) {
  const set = new Set();
  Object.values(data.persons).forEach(p => fields.forEach(f => {
    const v = String(p[f] || '').trim(); if (v.length > 1) set.add(v);
  }));
  return [...set].sort((a, b) => a.localeCompare(b, 'de')).map(v => `<option value="${esc(v)}">`).join('');
}

// ---- Spracheingabe: gesprochenen Satz in Felder zerlegen ----
// Beispiel: „Karl Weber, geboren am 17. Juni 1880 in Rothenburg, gestorben 1944, von Beruf Schmied“
const PARTICLES = ['von', 'van', 'de', 'zu', 'der', 'den', 'vom', 'zum'];
function capWords(s) {
  const w = s.trim().split(/\s+/);
  return w.map(x => w.length > 1 && PARTICLES.includes(x.toLowerCase()) ? x.toLowerCase() : x[0].toUpperCase() + x.slice(1)).join(' ');
}
function capFirst(s) { s = s.trim(); return s ? s[0].toUpperCase() + s.slice(1) : s; }
function clean(s) { return String(s || '').replace(/^[\s,.;:–-]+|[\s,.;:–-]+$/g, '').replace(/\s+und$/i, '').trim(); }
function parseEvent(seg) {
  seg = clean(seg); const out = {};
  const pm = seg.match(/(?:^|\s)(?:in|zu|im ort)\s+(.+)$/i);
  if (pm && !/^\d/.test(pm[1]) && !/^(jahr|jahre|januar|februar|märz|april|mai|juni|juli|august|september|oktober|november|dezember)\b/i.test(pm[1])) {
    out.place = capFirst(clean(pm[1])); seg = seg.slice(0, pm.index);
  }
  let d = clean(seg).replace(/^(am|im jahre?|im|anno|des jahres)\s+/i, '').replace(/\s+im jahre?\s+/i, ' ').replace(/^den\s+/i, '');
  let n = normDate(d);
  if (!prettyDate(n)) {   // Datum irgendwo im Text suchen
    const m = d.match(/(?:(um|ca\.?|circa|etwa|ungefähr|vor|nach)\s+)?(\d{1,2}\.?\s*[a-zäA-ZÄ]{3,}\.?\s*\d{4}|\d{1,2}\.\d{1,2}\.\d{4}|[a-zäA-ZÄ]{3,}\s+\d{4}|\d{4})/i);
    if (m) { n = normDate((m[1] ? m[1] + ' ' : '') + m[2]); if (!prettyDate(n)) n = ''; } else n = '';
  }
  if (n) out.date = n;
  return out;
}
function parseSpoken(text) {
  const r = {};
  let s = ' ' + String(text || '').replace(/\s+/g, ' ').trim() + ' ';
  let m;
  // Beruf
  if ((m = s.match(/\s(?:war\s+)?([A-Za-zÄÖÜäöüß-]+)\s+von beruf(?=\s*(?:[,.;]|$|\s(?:geboren|geborene|gestorben|verstorben|lebt)\b))/i))) {
    r.occupation = capWords(m[1]); s = s.replace(m[0], ' ');
  } else if ((m = s.match(/\s(?:von beruf|beruf|arbeitete als|tätig als|arbeitet als)\s*:?\s*([^,.;]+?)(?=\s(?:geboren|geborene|gestorben|verstorben|lebt)\b|[,.;]|\s*$)/i))) {
    r.occupation = capWords(clean(m[1])); s = s.replace(m[0], ' ');
  } else if ((m = s.match(/\s(?:war\s+)?([A-Za-zÄÖÜäöüß-]+)\s+von beruf\b/i))) {
    r.occupation = capWords(m[1]); s = s.replace(m[0], ' ');
  }
  // Lebt noch?
  if ((m = s.match(/\s(lebt noch|lebt|ist noch am leben)\b/i))) { r.status = 'lebt'; s = s.replace(m[0], ' '); }
  // In Abschnitte zerlegen: Name | geboren … | gestorben … | geborene …
  const re = /(?:^|\s)(geborene|geb\.|mädchenname|geburtsname|geboren|gestorben|verstorben|gest\.|tot seit)(?=\s|$)/gi;
  const hits = []; while ((m = re.exec(s))) hits.push({ kw: m[1].toLowerCase(), start: m.index, end: m.index + m[0].length });
  const namePart = clean(hits.length ? s.slice(0, hits[0].start) : s);
  hits.forEach((h, i) => {
    const seg = s.slice(h.end, i + 1 < hits.length ? hits[i + 1].start : s.length);
    if (/^(geborene|geb\.|mädchenname|geburtsname)$/.test(h.kw)) {
      const w = clean(seg).split(/[\s,]+/)[0]; if (w) { r.birthName = capWords(w); if (h.kw !== 'geburtsname') r.gender = 'w'; }
      // Rest nach dem Geburtsnamen kann z. B. „1880 in Ulm“ sein
    } else if (h.kw === 'geboren') {
      const e = parseEvent(seg); if (e.date) r.birthDate = e.date; if (e.place) r.birthPlace = e.place;
    } else {
      const e = parseEvent(seg); if (e.date) r.deathDate = e.date; if (e.place) r.deathPlace = e.place; r.status = 'verstorben';
    }
  });
  // Name, evtl. mit „Herr/Frau“ und Jahreszahlen „1880 bis 1944“
  let name = namePart;
  if ((m = name.match(/\s*\(?\s*(\d{4})\s*(?:bis|-|–)\s*(\d{4})\s*\)?\s*$/))) {
    if (!r.birthDate) r.birthDate = m[1]; if (!r.deathDate) { r.deathDate = m[2]; r.status = 'verstorben'; }
    name = clean(name.slice(0, m.index));
  }
  if ((m = name.match(/^(herr|frau)\s+/i))) { r.gender = m[1].toLowerCase() === 'herr' ? 'm' : 'w'; name = name.slice(m[0].length); }
  name = name.replace(/[^A-Za-zÄÖÜäöüß\s'-]/g, ' ').trim();
  if (name) {
    const w = name.split(/\s+/);
    if (w.length === 1) r.firstName = capWords(w[0]);
    else {
      let k = w.length - 1; while (k > 1 && PARTICLES.includes(w[k - 1].toLowerCase())) k--;
      r.firstName = capWords(w.slice(0, k).join(' ')); r.lastName = capWords(w.slice(k).join(' '));
    }
  }
  return r;
}

  const field = n => dlg.querySelector(`[name="${n}"]`);

  };
  dlg.querySelectorAll('[data-seg] button').forEach(b => b.onclick = () => setSeg(b.parentElement.dataset.seg, b.dataset.v));
  setSeg('status', p.status);

  // Spracheingabe
  const vPanel = dlg.querySelector('#voicePanel'), vText = dlg.querySelector('#voiceText'), vMsg = dlg.querySelector('#voiceMsg'), vMic = dlg.querySelector('#voiceMic');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false;
  const applyVoice = () => {
    const r = parseSpoken(vText.value); const filled = [];
    ['firstName', 'lastName', 'birthName', 'birthDate', 'birthPlace', 'deathDate', 'deathPlace', 'occupation'].forEach(k => {
      if (r[k]) { field(k).value = r[k]; field(k).classList.remove('flash'); void field(k).offsetWidth; field(k).classList.add('flash'); filled.push(k); }
    });
    if (r.gender) setSeg('gender', r.gender);
    if (r.status) setSeg('status', r.status);
    if (r.occupation) dlg.querySelector('details.more').open = true;
    ['birthDate', 'deathDate'].forEach(showHint);
    vMsg.textContent = filled.length ? '✓ Übernommen – bitte kurz prüfen. Die gelb markierten Felder wurden ausgefüllt.' : 'Ich konnte nichts erkennen. Versuch es bitte noch einmal.';
  };
  const startMic = () => {
    if (!SR) { vMsg.textContent = 'Dein Browser kann hier nicht zuhören. Tipp: Tippe ins Textfeld und nutze das Mikrofon deiner Tastatur.'; vText.focus(); return; }
    if (listening) { rec.stop(); return; }
    rec = new SR(); rec.lang = 'de-DE'; rec.interimResults = true; rec.continuous = false;
    rec.onresult = e => { let t = ''; for (const x of e.results) t += x[0].transcript; vText.value = t; };
    rec.onerror = e => { vMsg.textContent = e.error === 'not-allowed' ? 'Das Mikrofon ist nicht erlaubt. Bitte im Browser das Mikrofon für diese Seite erlauben.' : 'Es hat nicht geklappt (' + e.error + '). Bitte noch einmal versuchen.'; };
    rec.onend = () => { listening = false; vMic.textContent = '🎤 Nochmal sprechen'; vMic.classList.remove('rec'); if (vText.value.trim()) applyVoice(); };
    vText.value = ''; vMsg.textContent = 'Ich höre zu … sprich jetzt.';

  };
  dlg.querySelector('#voiceOpen').onclick = () => { vPanel.hidden = false; dlg.querySelector('#voiceOpen').hidden = true; startMic(); };
  vMic.onclick = startMic;
  dlg.querySelector('#voiceApply').onclick = applyVoice;

  // Datumsfelder: Hinweis anzeigen, beim Verlassen vereinheitlichen, Kalender-Knopf
  const showHint = n => {
    const v = normDate(field(n).value), h = dlg.querySelector(`[data-hint="${n}"]`);
    const pr = v && prettyDate(v);
    h.textContent = !v ? '' : pr ? '✓ ' + pr : 'wird als Text gespeichert';
    h.className = 'datehint' + (v && !pr ? ' free' : '');
  };
  ['birthDate', 'deathDate'].forEach(n => {
    field(n).addEventListener('input', () => showHint(n));
    field(n).addEventListener('blur', () => {
      field(n).value = normDate(field(n).value); showHint(n);
      const by = yearOf(field('birthDate').value);
      if (n === 'deathDate' && field(n).value && field('status').value !== 'verstorben') setSeg('status', 'verstorben');
      if (n === 'birthDate' && by && by < THIS_YEAR - 110 && field('status').value === 'unbekannt') setSeg('status', 'verstorben');

  dlg.querySelectorAll('[data-cal]').forEach(b => b.onclick = () => {
    const n = b.dataset.cal, hd = dlg.querySelector(`.hiddendate[data-for="${n}"]`);
    const m = normDate(field(n).value).match(/^(\d{2})\.(\d{2})\.(\d{4})$/);

  });
  dlg.querySelectorAll('.hiddendate').forEach(hd => hd.onchange = () => {
    if (!hd.value) return; const n = hd.dataset.for;

  });

  const unlinked = new Set();

  dlg.querySelector('#photoIn').onchange = async e => {
    const file = e.target.files[0]; if (!file) return;

  const del = dlg.querySelector('#photoDel');
  if (del) del.onclick = () => { p.photo = ''; dlg.querySelector('#photoPrev').innerHTML = avatarHTML(p); del.remove(); };
  dlg.querySelector('#cancel').onclick = closeModal;

  const doSave = () => {
    dlg.querySelectorAll('[name]').forEach(el => { p[el.name] = el.value.trim(); });
    p.birthDate = normDate(p.birthDate); p.deathDate = normDate(p.deathDate);
    p.father = p.father || null; p.mother = p.mother || null;
    if (!p.firstName && !p.lastName) { alert('Bitte mindestens einen Vor- oder Nachnamen eingeben.'); return false; }
    if (p.status === 'lebt') { p.deathDate = ''; p.deathPlace = ''; }
    else if (p.deathDate || p.deathPlace) p.status = 'verstorben';
    unlinked.forEach(s => { p.spouses = p.spouses.filter(x => x !== s); if (P(s)) P(s).spouses = P(s).spouses.filter(x => x !== p.id); });
    data.persons[p.id] = p;
    if (isNew) {
      if (!P(data.rootId)) data.rootId = p.id;
      if (!P(data.focusId)) data.focusId = p.id;
      if (onCreate) onCreate(p.id);
    }
    save(); closeModal(); refresh();
    return true;
  };
  dlg.querySelector('#ok').onclick = () => {
    if (doSave() && (!isNew || sheetId)) openDetail(isNew ? (sheetId || p.id) : p.id);
  };
  const ag = dlg.querySelector('#again');
  if (ag) ag.onclick = () => { if (doSave()) personForm(null, again.preset, onCreate, title, again); };
  if (isNew) setTimeout(() => field(p.lastName && !p.firstName ? 'firstName' : 'firstName').focus(), 50);
}

function shrinkPhoto(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = 180, c = document.createElement('canvas'); c.width = c.height = s;
      const m = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = rej; img.src = url;
  });
}

// Verwandte hinzufügen: neue Person anlegen oder vorhandene verknüpfen
const KIND = { father: 'Vater', mother: 'Mutter', spouse: 'Partner/in', child: 'Kind' };
function link(baseId, kind, otherId) {
  const b = P(baseId), o = P(otherId); if (!b || !o || baseId === otherId) return;
  if (kind === 'father') b.father = otherId;
  else if (kind === 'mother') b.mother = otherId;
  else if (kind === 'spouse') {
    if (!b.spouses.includes(otherId)) b.spouses.push(otherId);
    if (!o.spouses.includes(baseId)) o.spouses.push(baseId);
  } else if (kind === 'child') {
    if (b.gender === 'w' || (b.gender !== 'm' && o.father)) o.mother = baseId; else o.father = baseId;
    const sp = b.spouses.filter(P);
    if (sp.length === 1) { if (o.father === baseId && !o.mother) o.mother = sp[0]; else if (o.mother === baseId && !o.father) o.father = sp[0]; }
  }
}
function addRelative(baseId, kind) {
  const b = P(baseId); if (!b) return;
  const preset = {};
  const fam = b.birthName && b.gender === 'w' ? b.birthName : b.lastName;   // Familienname der Eltern
  if (kind === 'father') { preset.gender = 'm'; preset.lastName = fam; preset.status = 'unbekannt'; }
  if (kind === 'mother') { preset.gender = 'w'; preset.lastName = fam; }
  if (kind === 'child') preset.lastName = b.lastName;
  if (kind === 'spouse') { preset.gender = b.gender === 'm' ? 'w' : b.gender === 'w' ? 'm' : 'u'; if (b.gender === 'm') preset.lastName = b.lastName; }
  // Wer ein Elternteil oder Partner von jemandem ist, der vor über 110 Jahren geboren wurde, ist sicher verstorben
  const by = yearOf(b.birthDate);
  if (by && by < THIS_YEAR - 110 && kind !== 'child') preset.status = 'verstorben';
  const title = `${KIND[kind]} von ${esc(fullName(b))}`;
  const again = kind === 'child' ? { label: 'noch ein Kind', preset } : null;
  const startNew = () => personForm(null, preset, id => link(baseId, kind, id), 'Neu: ' + title, again);
  const others = sortedPersons().filter(p => p.id !== baseId);
  if (!others.length) return startNew();
  const dlg = openModal(`
    <h2>${title}</h2>
    <div class="menu-list">
      <button class="btn primary" id="new">＋ Neue Person anlegen</button>
    </div>
    <label style="margin-top:18px">… oder eine Person verknüpfen, die schon im Stammbaum ist:</label>
    <select id="pick">${personOptions('', baseId)}</select>
    <div class="actions">
      <button class="btn" id="cancel">Abbrechen</button>
      <button class="btn primary" id="ok">🔗 Verknüpfen</button>
    </div>`);
  dlg.querySelector('#new').onclick = startNew;
  dlg.querySelector('#cancel').onclick = closeModal;
  dlg.querySelector('#ok').onclick = () => {
    const v = dlg.querySelector('#pick').value; if (!v) { alert('Bitte eine Person auswählen.'); return; }
    link(baseId, kind, v); save(); closeModal(); refresh(); if (sheetId) openDetail(sheetId);
  };
}

function deletePerson(id) {
  const p = P(id); if (!p) return;
  if (!confirm(`„${fullName(p)}“ wirklich löschen? Die Verbindungen zu anderen Personen werden gelöst.`)) return;
  delete data.persons[id];
  Object.values(data.persons).forEach(o => {
    if (o.father === id) o.father = null; if (o.mother === id) o.mother = null;
    o.spouses = (o.spouses || []).filter(s => s !== id);
  });
  if (data.focusId === id) data.focusId = null; if (data.rootId === id) data.rootId = null;
  save(); closeSheet(); refresh(true);
}

function download(text, name, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type + ';charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const fileInput = document.getElementById('fileInput');
function pickFile(mode) { fileInput.dataset.mode = mode; fileInput.value = ''; fileInput.click(); }
fileInput.onchange = async () => {
  const file = fileInput.files[0]; if (!file) return;
  const buf = await file.arrayBuffer();
  let text = new TextDecoder('utf-8').decode(buf);
  try {
    let next;
    if (fileInput.dataset.mode === 'json') {
      next = JSON.parse(text); if (!next || !next.persons) throw new Error();
    } else {
      if (/^1 CHAR (ANSI|IBM|ASCII)/m.test(text)) text = new TextDecoder('windows-1252').decode(buf);
      const persons = importGedcom(text); const ids = Object.keys(persons);
      if (!ids.length) throw new Error();
      next = { version: 1, persons, rootId: ids[0], focusId: ids[0] };
    }
    const cnt = Object.keys(next.persons).length;
    if (Object.keys(data.persons).length && !confirm(`Die Datei enthält ${cnt} Personen. Sie ersetzt den aktuellen Stammbaum. Fortfahren?`)) return;
    data = next; save(); closeModal(); closeSheet(); showTree(); refresh(true);
    alert(`${cnt} Personen geladen.`);
  } catch (e) { alert('Diese Datei konnte nicht gelesen werden.'); }
};

// ====================== GEDCOM (Austauschformat) ======================
const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
function toGedDate(s) {
  s = (s || '').trim(); let m;
  if ((m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/)) && MON[+m[2] - 1]) return `${+m[1]} ${MON[+m[2] - 1]} ${m[3]}`;
  if ((m = s.match(/^(\d{1,2})\.(\d{4})$/)) && MON[+m[1] - 1]) return `${MON[+m[1] - 1]} ${m[2]}`;
  if ((m = s.match(/^(um|ca\.?|etwa)\s+(\d{4})$/i))) return 'ABT ' + m[2];
  if ((m = s.match(/^vor\s+(\d{4})$/i))) return 'BEF ' + m[1];
  if ((m = s.match(/^nach\s+(\d{4})$/i))) return 'AFT ' + m[1];
  return s;
}
function fromGedDate(s) {
  s = (s || '').trim(); let m;
  const two = n => String(n).padStart(2, '0');
  if ((m = s.match(/^(\d{1,2}) ([A-Za-z]{3}) (\d{4})$/)) && MON.includes(m[2].toUpperCase())) return `${two(m[1])}.${two(MON.indexOf(m[2].toUpperCase()) + 1)}.${m[3]}`;
  if ((m = s.match(/^([A-Za-z]{3}) (\d{4})$/)) && MON.includes(m[1].toUpperCase())) return `${two(MON.indexOf(m[1].toUpperCase()) + 1)}.${m[2]}`;
  return s.replace(/^ABT\b/i, 'um').replace(/^(EST|CAL)\b/i, 'ca.').replace(/^BEF\b/i, 'vor').replace(/^AFT\b/i, 'nach');
}
function exportGedcom() {
  const one = s => String(s || '').replace(/\s*\n\s*/g, ' ');
  const ps = Object.values(data.persons), ix = {};
  ps.forEach((p, i) => ix[p.id] = '@I' + (i + 1) + '@');
  const fams = new Map();
  const fam = (a, b) => {
    const k = [a || '', b || ''].sort().join('|');
    if (!fams.has(k)) fams.set(k, { parents: [a, b].filter(Boolean), children: [], id: '@F' + (fams.size + 1) + '@' });
    return fams.get(k);
  };
  ps.forEach(p => (p.spouses || []).forEach(s => { if (P(s)) fam(p.id, s); }));
  ps.forEach(p => { const fa = P(p.father) ? p.father : null, mo = P(p.mother) ? p.mother : null; if (fa || mo) fam(fa, mo).children.push(p.id); });
  const L = ['0 HEAD', '1 SOUR UNSER_STAMMBAUM', '1 GEDC', '2 VERS 5.5.1', '2 FORM LINEAGE-LINKED', '1 CHAR UTF-8'];
  const multi = (lvl, tag, text) => String(text).split(/\r?\n/).forEach((ln, i) => L.push(i ? `${lvl + 1} CONT ${ln}` : `${lvl} ${tag} ${ln}`));
  ps.forEach(p => {
    L.push(`0 ${ix[p.id]} INDI`);
    const sur = p.birthName || p.lastName;
    L.push(`1 NAME ${one(p.firstName)} /${one(sur)}/`);
    if (p.firstName) L.push('2 GIVN ' + one(p.firstName)); if (sur) L.push('2 SURN ' + one(sur));
    if (p.birthName && p.lastName && p.birthName !== p.lastName) L.push(`1 NAME ${one(p.firstName)} /${one(p.lastName)}/`, '2 TYPE married');
    L.push('1 SEX ' + ({ m: 'M', w: 'F' }[p.gender] || 'U'));
    if (p.birthDate || p.birthPlace) { L.push('1 BIRT'); if (p.birthDate) L.push('2 DATE ' + toGedDate(one(p.birthDate))); if (p.birthPlace) L.push('2 PLAC ' + one(p.birthPlace)); }
    if (p.deathDate || p.deathPlace) { L.push('1 DEAT'); if (p.deathDate) L.push('2 DATE ' + toGedDate(one(p.deathDate))); if (p.deathPlace) L.push('2 PLAC ' + one(p.deathPlace)); }
    else if (p.status === 'verstorben') L.push('1 DEAT Y');
    if (p.occupation) L.push('1 OCCU ' + one(p.occupation));
    if (p.notes) multi(1, 'NOTE', p.notes);
    if (p.sources) multi(1, 'SOUR', p.sources);
    fams.forEach(f => { if (f.parents.includes(p.id)) L.push('1 FAMS ' + f.id); if (f.children.includes(p.id)) L.push('1 FAMC ' + f.id); });
  });
  fams.forEach(f => {
    L.push(`0 ${f.id} FAM`);
    let [a, b] = f.parents;
    if (b) { if (P(a).gender === 'w' || P(b).gender === 'm') [a, b] = [b, a]; L.push('1 HUSB ' + ix[a], '1 WIFE ' + ix[b]); }

function importGedcom(text) {

        } else if (l.tag === 'SEX') p.gender = { M: 'm', F: 'w' }[l.val.trim().toUpperCase()] || 'u';
        else if (l.tag === 'DEAT' || l.tag === 'BURI') p.status = 'verstorben';
        else if (l.tag === 'OCCU') p.occupation = l.val;
        else if ((l.tag === 'NOTE' || l.tag === 'SOUR') && !l.val.startsWith('@')) {

        }

        else if (l.tag === 'CONC' && txt) p[txt] += l.val;

          if (ctx === 'BIRT' || ((ctx === 'CHR' || ctx === 'BAPM') && !p['birth' + f])) p['birth' + f] = v;

}
