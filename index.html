<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#002d72">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Unser Stammbaum</title>
<style>
  :root {
    --bg: #eef2f8; --paper: #ffffff; --ink: #14213d; --muted: #5b6880;
    --green: #002d72; --green2: #1d4f9e; --gold: #ff5910;   /* Farben: Mets-Blau und Mets-Orange */
    --m-bg: #dfe9f7; --m-bd: #2f62b0;
    --w-bg: #ffe6d8; --w-bd: #d4622a;
    --u-bg: #e8ebf0; --u-bd: #7d8799;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; cursor: pointer; }

  header { background: var(--green); color: #fff; display: flex; align-items: center;
    gap: 6px; padding: 8px 10px; padding-top: max(8px, env(safe-area-inset-top)); border-bottom: 4px solid var(--gold); }
  header h1 { font-family: Georgia, serif; font-size: 1.25rem; margin: 0 auto 0 4px; font-weight: normal; }
  header button { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25);
    border-radius: 10px; padding: 8px 11px; font-size: .95rem; }
  header button.active { background: #fff; color: var(--green); }
  @media (max-width: 480px) {
    header h1 { font-size: 1.05rem; } header h1 .long { display: none; }
    header button { padding: 7px 9px; font-size: .9rem; }
  }

  main { flex: 1; position: relative; overflow: hidden; }
  #treeView, #listView { position: absolute; inset: 0; }
  #tree { width: 100%; height: 100%; touch-action: none; display: block;
    background: radial-gradient(circle at 50% 40%, #f8faff 0%, var(--bg) 70%); }

  .card rect.box { stroke-width: 2; filter: drop-shadow(0 2px 3px rgba(0,30,80,.18)); }
  .card.g-m rect.box { fill: var(--m-bg); stroke: var(--m-bd); }
  .card.g-w rect.box { fill: var(--w-bg); stroke: var(--w-bd); }
  .card.g-u rect.box, .card.g-d rect.box { fill: var(--u-bg); stroke: var(--u-bd); }
  .card.focus rect.box { stroke: var(--gold); stroke-width: 4; }
  .card text { fill: var(--ink); pointer-events: none; }
  .t-first { font: 600 15px Georgia, serif; }
  .t-last { font: 14px Georgia, serif; }
  .t-life { font: 12px system-ui, sans-serif; fill: var(--muted) !important; }
  .t-lock { font-size: 12px; }
  .ghost rect { fill: rgba(255,255,255,.45); stroke: var(--muted); stroke-dasharray: 6 5; stroke-width: 1.5; }
  .ghost text { fill: var(--muted); font: 14px system-ui, sans-serif; pointer-events: none; }
  .line { fill: none; stroke: #8a9ab5; stroke-width: 2; }
  .marry { font: 16px Georgia, serif; fill: var(--gold); }

  .zoom { position: absolute; left: 10px; bottom: calc(14px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 6px; }
  .zoom button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid #b8c4d8;
    background: var(--paper); font-size: 1.3rem; color: var(--green); box-shadow: 0 2px 4px rgba(0,0,0,.12); }

  #fab { position: absolute; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom));
    background: var(--gold); color: #fff; border: none; border-radius: 28px; padding: 14px 20px;
    font-size: 1.05rem; box-shadow: 0 3px 8px rgba(0,0,0,.25); }

  #emptyHint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; }
  #emptyHint .box { background: var(--paper); border-radius: 16px; padding: 24px; max-width: 420px;
    text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.12); }
  #emptyHint h2 { font-family: Georgia, serif; margin-top: 0; }

  #listView { overflow-y: auto; padding: 12px; padding-bottom: 90px; }
  #search { width: 100%; padding: 12px; font-size: 1rem; border-radius: 12px; border: 1px solid #b8c4d8; background: var(--paper); }
  .count { color: var(--muted); margin: 8px 4px; font-size: .9rem; }
  .row { display: flex; align-items: center; gap: 12px; background: var(--paper); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 8px; border-left: 5px solid var(--u-bd); cursor: pointer; }
  .row.g-m { border-left-color: var(--m-bd); } .row.g-w { border-left-color: var(--w-bd); }
  .row .nm { font-family: Georgia, serif; font-size: 1.05rem; }
  .row .sub { color: var(--muted); font-size: .85rem; }
  .avatar { width: 46px; height: 46px; border-radius: 50%; flex: none; object-fit: cover;
    display: flex; align-items: center; justify-content: center; font-family: Georgia, serif;
    font-size: 1.2rem; color: #fff; background: var(--u-bd); }
  .avatar.g-m { background: var(--m-bd); } .avatar.g-w { background: var(--w-bd); }

  /* Detail-Ansicht */
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 78vh; background: var(--paper);
    border-radius: 18px 18px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,.22); overflow-y: auto;
    z-index: 20; padding: 0 16px calc(20px + env(safe-area-inset-bottom)); }
  @media (min-width: 900px) {
    #sheet { left: auto; top: 60px; width: 400px; max-height: none; border-radius: 18px 0 0 0; }
  }
  .sheet-head { position: sticky; top: 0; background: var(--paper); display: flex; gap: 12px;
    align-items: center; padding: 16px 0 10px; border-bottom: 1px solid #dfe5ef; }
  .sheet-head .avatar { width: 64px; height: 64px; font-size: 1.6rem; }
  .sheet-head h2 { font-family: Georgia, serif; margin: 0; font-size: 1.3rem; }
  .sheet-head .sub { color: var(--muted); font-size: .9rem; }
  .close { margin-left: auto; align-self: flex-start; background: none; border: none; font-size: 1.6rem; color: var(--muted); padding: 4px 8px; }
  h3 { font-family: Georgia, serif; font-size: 1rem; color: var(--green); margin: 16px 0 6px; }
  .facts { width: 100%; border-collapse: collapse; }
  .facts td { padding: 4px 0; vertical-align: top; }
  .facts td:first-child { color: var(--muted); width: 90px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: #e6ecf5; border: 1px solid #cdd6e4; border-radius: 16px; padding: 6px 12px; font-size: .92rem; color: var(--ink); }
  .chip.g-m { background: var(--m-bg); border-color: #a9c1e4; } .chip.g-w { background: var(--w-bg); border-color: #f3b896; }
  .note { white-space: pre-wrap; background: #f2f5fa; border-radius: 10px; padding: 10px; }
  .note a { color: var(--green); word-break: break-all; }
  .research { border-radius: 12px; padding: 12px; margin-top: 14px; font-size: .92rem; }
  .research.locked { background: #e9eef7; border: 1px solid #b8c4d8; }
  .research.open { background: #fff1e8; border: 1px solid #ffc29f; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
  .btn { background: #e6ecf5; border: 1px solid #b8c4d8; border-radius: 12px; padding: 11px 10px; color: var(--ink); font-size: .95rem; }
  .btn.primary { background: var(--green); color: #fff; border-color: var(--green); }
  .btn.danger { background: #fff; color: #a33; border-color: #d9a3a3; }
  .btn.wide { grid-column: 1 / -1; }

  /* Fenster für Formulare */
  #modal { position: fixed; inset: 0; background: rgba(0,20,60,.45); z-index: 30; display: flex;
    align-items: flex-end; justify-content: center; }
  @media (min-width: 700px) { #modal { align-items: center; } }
  .dialog { background: var(--paper); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
    border-radius: 18px 18px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom)); }
  @media (min-width: 700px) { .dialog { border-radius: 18px; } }
  .dialog h2 { font-family: Georgia, serif; margin: 0 0 12px; }
  .dialog label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 4px; }
  .dialog input, .dialog select, .dialog textarea { width: 100%; padding: 11px; font-size: 1rem;
    border-radius: 10px; border: 1px solid #b8c4d8; background: #fff; color: var(--ink); font-family: inherit; }
  .dialog textarea { min-height: 80px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hint { font-size: .82rem; color: var(--muted); margin-top: 4px; }
  .menu-list { display: flex; flex-direction: column; gap: 8px; }
  .menu-list .btn { text-align: left; padding: 14px; }
  .privacy { background: #fff1e8; border-radius: 12px; padding: 12px; font-size: .9rem; margin-bottom: 14px; }
  .partner-row { display: flex; align-items: center; justify-content: space-between; background: #eef2f8; border-radius: 10px; padding: 6px 10px; margin-bottom: 6px; }
  .partner-row button { background: none; border: none; color: #a33; font-size: 1.1rem; }
  [hidden] { display: none !important; }
  .namerow { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 2px; }
  .namerow input { flex: 1 1 7em; min-width: 6em; padding: 5px 6px; font: .92rem system-ui, sans-serif; border: 1px solid #b8c4d8; border-radius: 8px; background: #fff; }
  .namerow input.nf, .namerow input.nl { font-weight: 600; }
  input.nameinp { display: inline-block; width: auto; min-width: 9em; max-width: 100%; padding: 4px 6px; font: 600 .95rem system-ui, sans-serif; border: 1px solid #b8c4d8; border-radius: 8px; }
  div.sugl { display: flex; gap: 10px; align-items: flex-start; } div.sugl input[type=checkbox] { width: 24px; height: 24px; flex: none; margin-top: 1px; }
  div.sug.holds { background: #f1f3f7; opacity: .85; }
  .sugrole select { width: auto; max-width: 100%; padding: 5px 6px; font-size: .88rem; margin: 3px 2px 0 0; border-radius: 8px; border: 1px solid #b8c4d8; background: #fff; }
  #updBar { position: fixed; left: 10px; right: 10px; top: calc(70px + env(safe-area-inset-top)); z-index: 25; display: flex; align-items: center; gap: 8px;
    background: var(--paper); border: 2px solid var(--gold); border-radius: 14px; padding: 8px 10px; box-shadow: 0 4px 14px rgba(0,20,60,.25); font-size: .92rem; }
  #updBar span { flex: 1; } #updBar .btn { background: var(--gold); color: #fff; border-color: var(--gold); padding: 8px 10px; }
  #updBar .updx { background: none; border: none; font-size: 1.2rem; color: var(--muted); }
  div.sug.conflict { background: #fff4ec; border-color: var(--gold); } .fixbtn { display: block; width: 100%; margin-top: 6px; text-align: left; }
  div.sug { background: #fff; border: 1px solid #cdd6e4; border-radius: 12px; padding: 10px; margin: 0 0 8px; font-size: .95rem; }
  label.sugl { display: flex; gap: 10px; align-items: flex-start; margin: 0; color: var(--ink); font-size: .95rem; }
  label.sugl input { width: 24px; height: 24px; flex: none; margin-top: 1px; }
  .sugrole { margin: 6px 0 0 34px; font-size: .9rem; } .sugsrc { margin: 4px 0 0 34px; } .sugsrc a { color: var(--green); word-break: break-all; }
  .count .mini, #count .mini { font: .85rem system-ui, sans-serif; background: #fff; border: 1px solid #b8c4d8; border-radius: 8px; padding: 2px 8px; color: #a33; }
  select.rolesel { width: auto; padding: 4px 6px; font-size: .88rem; margin-top: 4px; border-radius: 8px; border: 1px solid #b8c4d8; background: #fff; }
  h3 .mini { font: .8rem system-ui, sans-serif; background: none; border: 1px solid #b8c4d8; border-radius: 8px; padding: 2px 8px; color: var(--green); margin-left: 6px; vertical-align: middle; }
  .snip { background: #fff; border: 1px solid #cdd6e4; border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; font-size: .88rem; cursor: pointer; }
  .snip.on { border: 2px solid var(--green); background: #fff1e8; }
  .phototip { font-size: .88rem; margin-top: 8px; } .phototip summary { color: var(--green); font-weight: 600; cursor: pointer; } .phototip ol { margin: 6px 0; padding-left: 20px; }
  label.sug { display: flex; gap: 10px; align-items: flex-start; background: #fff; border: 1px solid #cdd6e4; border-radius: 12px; padding: 10px; margin: 0 0 8px; color: var(--ink); font-size: .95rem; }
  label.sug input { width: 22px; height: 22px; flex: none; margin-top: 2px; }
  label.sug a { color: var(--green); word-break: break-all; }
  .warn { color: #a33; font-size: .85rem; }
  .sure-sicher { color: #2e7d32; font-weight: 600; } .sure-wahrscheinlich { color: #b07d10; font-weight: 600; } .sure-unsicher { color: #a33; font-weight: 600; }
  .google-btn { display: block; text-align: center; text-decoration: none; margin-top: 10px; background: #fff; }
  .research-btn { width: 100%; margin-top: 14px; padding: 13px; font-size: 1rem; }
  .srclist { display: flex; flex-direction: column; gap: 8px; }
  a.src { display: block; text-decoration: none; color: var(--ink); background: #fff; border: 1px solid #cdd6e4; border-radius: 12px; padding: 10px 12px; }
  a.src b { color: var(--green); display: block; }
  a.src span { font-size: .85rem; color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 16px; border-radius: 20px; z-index: 50; font-size: .9rem; max-width: 90%; text-align: center; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; padding: 10px 4px; border-radius: 10px; border: 1px solid #b8c4d8; background: #fff; color: var(--ink); font-size: .95rem; }
  .seg button.on { background: var(--green); border-color: var(--green); color: #fff; }
  .two.dates { grid-template-columns: 1.15fr 1fr; }
  .datewrap { display: flex; gap: 6px; position: relative; }
  .datewrap input[name] { flex: 1; min-width: 0; }
  .calbtn { flex: none; width: 46px; border-radius: 10px; border: 1px solid #b8c4d8; background: #fff; font-size: 1.2rem; }
  .hiddendate { position: absolute; right: 0; bottom: 0; width: 46px !important; height: 1px; opacity: 0; pointer-events: none; padding: 0 !important; border: 0 !important; }
  .datehint { font-size: .8rem; color: var(--green2); min-height: 1.1em; margin-top: 3px; }
  .datehint.free { color: var(--muted); }
  .voicebtn { width: 100%; margin-bottom: 4px; background: #fff1e8; border-color: #ffc29f; font-weight: 600; }
  .voice { background: #eef2f8; border-radius: 12px; padding: 10px; margin-bottom: 6px; }
  .voice textarea { min-height: 70px; margin: 8px 0; }
  .voice .btn.rec { background: #b03a3a; color: #fff; border-color: #b03a3a; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .7; } }
  .flash { animation: flash 2.5s ease-out; }
  @keyframes flash { 0% { background: #fde68a; } 100% { background: #fff; } }
  details.more { margin-top: 16px; border-top: 1px solid #dfe5ef; padding-top: 6px; }
  details.more summary { cursor: pointer; color: var(--green); font-weight: 600; padding: 8px 0; }
</style>
</head>
<body>
<header>
  <h1>🌳 <span class="long">Unser </span>Stammbaum</h1>
  <button id="btnTree" class="active">Baum</button>
  <button id="btnList">Liste</button>
  <button id="btnHome" title="Zur Startperson">🏠</button>
  <button id="btnMenu" title="Menü">☰</button>
</header>
<main>
  <section id="treeView">
    <svg id="tree"><g id="viewport"></g></svg>
    <div class="zoom">
      <button id="zoomIn" aria-label="Vergrößern">＋</button>
      <button id="zoomOut" aria-label="Verkleinern">－</button>
      <button id="zoomFit" aria-label="Einpassen">⤢</button>
    </div>
    <div id="emptyHint" hidden>
      <div class="box">
        <h2>Willkommen! 👋</h2>
        <p>Hier entsteht euer Familien-Stammbaum. Fang mit einer Person an – zum Beispiel mit dir selbst oder einem Großelternteil.</p>
        <p><button class="btn primary" id="btnFirst">＋ Erste Person anlegen</button></p>
        <p><button class="btn" id="btnDemo">👪 Beispiel-Familie ansehen</button></p>
        <p class="hint">Alle Daten bleiben nur auf diesem Gerät.</p>
      </div>
    </div>
  </section>
  <section id="listView" hidden>
    <input id="search" type="search" placeholder="🔍 Name, Ort oder Jahr suchen …">
    <div class="count" id="count"></div>
    <div id="list"></div>
  </section>
  <button id="fab">＋ Person</button>
</main>
<div id="sheet" hidden></div>
<div id="modal" hidden></div>
<input type="file" id="fileInput" hidden>

<script>
'use strict';
// ====================== Einstellungen ======================
const CW = 170, CH = 84;          // Größe einer Personen-Karte
const HG = 28, VG = 66;           // Abstand waagerecht / senkrecht
const MAX_ANCESTOR_GENS = 3;      // wie viele Generationen nach oben (Eltern, Großeltern, Urgroßeltern)
const MAX_DESC_GENS = 2;          // wie viele Generationen nach unten (Kinder, Enkel)
const PROTECT_YEARS = 110;        // wer vor mehr als so vielen Jahren geboren wurde, gilt als verstorben
const STORE_KEY = 'stammbaum-daten-v1';
const APP_VERSION = '2026-11-19 Nr. 33';   // bei jeder Änderung hochzählen – steht unten im Menü
const THIS_YEAR = new Date().getFullYear();

// ====================== Daten ======================
let data = load();
function emptyData() { return { version: 1, persons: {}, rootId: null, focusId: null }; }
function load() {
  try { const d = JSON.parse(localStorage.getItem(STORE_KEY)); if (d && d.persons) return d; } catch (e) {}
  return emptyData();
}
// ====================== Doppelte Personen finden und zusammenführen ======================
function dupScore(q) {   // wer „besser“ ist, bleibt erhalten: mehr Verbindungen, mehr Angaben, älterer Eintrag
  const links = (P(q.father) ? 1 : 0) + (P(q.mother) ? 1 : 0) + (q.spouses || []).filter(P).length + siblingsOf(q).length
    + Object.values(data.persons).filter(x => x.father === q.id || x.mother === q.id).length;
  const fields = ['birthDate', 'birthPlace', 'deathDate', 'deathPlace', 'occupation', 'birthName', 'photo', 'notes'].filter(f => q[f]).length;
  return links * 10 + fields - (q.added ? 1 : 0);
}
function isDuplicate(a, b) {
  if (a.id === b.id) return false;
  if (!sameName(a, b)) {
    // „Karl“ und „Karl Heinz“ mit gleichem Nachnamen gelten auch als möglich doppelt
    const fa = String(a.firstName || '').toLowerCase().split(/\s+/), fb = String(b.firstName || '').toLowerCase().split(/\s+/);
    const lastOk = [a.lastName, a.birthName].filter(Boolean).some(x => [b.lastName, b.birthName].filter(Boolean).some(y => koelner(x) === koelner(y)));
    if (!(lastOk && fa[0] && fa[0] === fb[0])) return false;
  }
  const ya = yearOf(a.birthDate), yb = yearOf(b.birthDate);
  if (ya && yb && ya !== yb) return false;
  if (a.gender !== 'u' && b.gender !== 'u' && a.gender !== b.gender) return false;
  if (a.father === b.id || a.mother === b.id || b.father === a.id || b.mother === a.id) return false;   // Vater/Sohn gleichen Namens
  // verschiedene eingetragene Eltern → wohl verschiedene Personen (z. B. Cousins gleichen Namens) –
  // außer die Eltern sind selbst gleichnamig (also vermutlich ebenfalls doppelt)
  const diffPar = (x, y) => P(x) && P(y) && x !== y && !sameName(P(x), P(y));
  if (diffPar(a.father, b.father) || diffPar(a.mother, b.mother)) return false;
  return true;
}
function findDuplicates() {
  const all = Object.values(data.persons), used = new Set(), groups = [];
  all.forEach(a => {
    if (used.has(a.id)) return;
    const g = [a].concat(all.filter(b => !used.has(b.id) && b.id !== a.id && isDuplicate(a, b)));
    if (g.length > 1) { g.forEach(x => used.add(x.id)); groups.push(g.sort((x, y) => dupScore(y) - dupScore(x))); }
  });
  return groups;
}
function mergeInto(keepId, dupId) {
  const k = P(keepId), d = P(dupId); if (!k || !d || keepId === dupId) return;
  ['firstName', 'lastName', 'birthName', 'birthDate', 'birthPlace', 'deathDate', 'deathPlace', 'occupation', 'photo'].forEach(f => {
    if (!k[f] && d[f]) k[f] = d[f]; else if (/Date$/.test(f) && d[f] && moreExact(f, k[f], d[f])) k[f] = d[f];
  });
  if (k.gender === 'u') k.gender = d.gender;
  if (k.status === 'unbekannt' && d.status !== 'unbekannt') k.status = d.status;
  if (!P(k.father) && P(d.father)) k.father = d.father;
  if (!P(k.mother) && P(d.mother)) k.mother = d.mother;
  k.notes = dedupeNotes([k.notes, d.notes].filter(Boolean).join('\n\n'));
  k.sources = dedupeLines([k.sources, d.sources].filter(Boolean).join('\n'));
  k.spouses = [...new Set((k.spouses || []).concat(d.spouses || []))];
  k.siblings = [...new Set((k.siblings || []).concat(d.siblings || []))];
  // alle Verweise auf die doppelte Person umbiegen
  Object.values(data.persons).forEach(q => {
    if (q.father === dupId) q.father = keepId;
    if (q.mother === dupId) q.mother = keepId;
    q.spouses = [...new Set((q.spouses || []).map(x => x === dupId ? keepId : x))].filter(x => x !== q.id);
    q.siblings = [...new Set((q.siblings || []).map(x => x === dupId ? keepId : x))].filter(x => x !== q.id);
  });
  if (data.focusId === dupId) data.focusId = keepId;
  if (data.rootId === dupId) data.rootId = keepId;
  delete data.persons[dupId];
}
function mergeWithDialog(id) {

// ====================== Widersprüchliche Verbindungen ======================
// z. B. jemand ist Partner/in UND Geschwister (oder Elternteil) derselben Person.
// Dann ist niemand doppelt gespeichert, aber die Person würde im Baum an zwei Stellen stehen.
function findConflicts(onlyId) {
  const out = [], seen = new Set();
  Object.values(data.persons).forEach(a => {
    (a.spouses || []).map(P).filter(Boolean).forEach(b => {
      const key = [a.id, b.id].sort().join('|'); if (seen.has(key)) return; seen.add(key);
      if (onlyId && a.id !== onlyId && b.id !== onlyId) return;
      if (siblingsOf(a).some(x => x.id === b.id)) out.push({ kind: 'sib', a: a.id, b: b.id });
      else if (a.father === b.id || a.mother === b.id) out.push({ kind: 'par', a: a.id, b: b.id });   // b ist Elternteil von a
      else if (b.father === a.id || b.mother === a.id) out.push({ kind: 'par', a: b.id, b: a.id });
    });
  });
  return out;
}
function conflictText(c) {
  const a = P(c.a), b = P(c.b);
  return c.kind === 'sib'
    ? `<b>${esc(fullName(a))}</b> und <b>${esc(fullName(b))}</b> sind als <b>Partner</b> und gleichzeitig als <b>Geschwister</b> eingetragen.`
    : `<b>${esc(fullName(b))}</b> ist als <b>Partner/in</b> und gleichzeitig als <b>${b.gender === 'w' ? 'Mutter' : b.gender === 'm' ? 'Vater' : 'Elternteil'}</b> von <b>${esc(fullName(a))}</b> eingetragen.`;
}
function conflictFixes(c) {   // [Schlüssel, Beschriftung]
  const a = P(c.a), b = P(c.b), fixes = [['nospouse', `Sind keine Partner – Partner-Verbindung lösen`]];
  if (c.kind === 'sib') {
    const parN = q => [P(q.father), P(q.mother)].filter(Boolean).map(fullName).join(' und ');
    [a, b].forEach(q => fixes.push(['nosib:' + q.id, `${fullName(q)} ist kein Geschwister` + (parN(q) ? ` (Verbindung zu den Eltern ${parN(q)} lösen)` : ' – Verbindung lösen')]));
  } else fixes.push(['nopar', `${fullName(b)} ist nicht ${b.gender === 'w' ? 'Mutter' : b.gender === 'm' ? 'Vater' : 'Elternteil'} von ${fullName(a)} – lösen`]);
  return fixes;
}
function fixConflict(c, how) {
  const a = P(c.a), b = P(c.b); if (!a || !b) return;
  if (how === 'nospouse') {
    a.spouses = (a.spouses || []).filter(x => x !== b.id); b.spouses = (b.spouses || []).filter(x => x !== a.id);
  } else if (how === 'nopar') {
    if (a.father === b.id) a.father = null; if (a.mother === b.id) a.mother = null;
  } else if (how.startsWith('nosib:')) {
    const q = P(how.slice(6)), other = q === a ? b : a; if (!q) return;
    const group = new Set(siblingsOf(other).map(x => x.id).concat(other.id));
    if (q.father && q.father === other.father) q.father = null;
    if (q.mother && q.mother === other.mother) q.mother = null;
    // direkte Geschwister-Verbindungen zwischen q und der Geschwistergruppe des anderen lösen
    q.siblings = (q.siblings || []).filter(x => !group.has(x));
    group.forEach(id => { const g = P(id); if (g) g.siblings = (g.siblings || []).filter(x => x !== q.id); });
  }
}
function conflictBlock(list) {
  return list.map((c, i) => `<div class="sug conflict"><div>⚠️ ${conflictText(c)}<br><small class="hint">Deshalb erschien ${esc(P(c.b).firstName || 'die Person')} bisher doppelt im Baum. Welche Verbindung ist falsch?</small></div>
    ${conflictFixes(c).map(([k, l]) => `<button class="btn wide fixbtn" data-c="${i}" data-fix="${esc(k)}">✕ ${esc(l)}</button>`).join('')}</div>`).join('');
}
function bindConflictButtons(root, list, after) {
  root.querySelectorAll('button[data-fix]').forEach(bt => bt.onclick = () => {
    const c = list[+bt.dataset.c]; if (!c) return;
    if (!confirm(bt.textContent.replace(/^✕\s*/, '') + '?')) return;
    fixConflict(c, bt.dataset.fix); save(); after();
  });
}
function showConflicts(info) {
  const list = findConflicts();
  if (!list.length) { alert((info ? info + '\n\n' : '') + 'Keine widersprüchlichen Verbindungen gefunden. 👍'); refresh(true); return; }
  const dlg = openModal(`<h2>⚠️ Verbindungen prüfen</h2>
    ${info ? `<div class="research open">${esc(info)}</div>` : ''}
    <p class="hint">Hier ist niemand doppelt gespeichert – aber eine Person ist auf zwei Arten verbunden, die nicht zusammenpassen. Tippe an, welche Verbindung <b>falsch</b> ist. Die Person selbst bleibt erhalten.</p>
    ${conflictBlock(list)}
    <div class="actions"><button class="btn wide" id="cancel">Schließen</button></div>`);
  dlg.querySelector('#cancel').onclick = () => { closeModal(); refresh(true); };
  bindConflictButtons(dlg, list, () => { closeModal(); refresh(true); showConflicts('✓ Verbindung gelöst.'); });
}

// Doppelte Einträge in Notizen (Absätze) und Quellen (Zeilen) entfernen
function noteKey(par) { return par.replace(/^\[[^\]]*\]\s*/, '').replace(/\s+/g, ' ').trim().toLowerCase(); }
function dedupeNotes(t) {
  const seen = new Set();
  return String(t || '').split(/\n\s*\n/).filter(par => { const k = noteKey(par); if (!k || seen.has(k)) return false; seen.add(k); return true; }).join('\n\n');
}
function dedupeLines(t) {
  const seen = new Set();
  return String(t || '').split('\n').filter(l => { const k = l.trim().toLowerCase(); if (!k || seen.has(k)) return false; seen.add(k); return true; }).join('\n');
}
function hasNote(p, text) { const k = noteKey(text); return !!k && String(p.notes || '').split(/\n\s*\n/).some(par => noteKey(par) === k); }
function save() {
  Object.values(data.persons).forEach(q => { q.notes = dedupeNotes(q.notes); q.sources = dedupeLines(q.sources); });
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
  catch (e) { alert('Speichern hat nicht geklappt – der Speicher ist voll. Bitte einige Fotos entfernen und eine Sicherung machen.'); }
}
function uid() { return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
const P = id => (id ? data.persons[id] : undefined);
function newPerson(o = {}) {
  return Object.assign({ id: uid(), firstName: '', lastName: '', birthName: '', gender: 'u', status: 'unbekannt',
    birthDate: '', birthPlace: '', deathDate: '', deathPlace: '', occupation: '', notes: '', sources: '',
    photo: '', father: null, mother: null, spouses: [], siblings: [] }, o);
}

// ====================== Hilfsfunktionen ======================
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function yearOf(s) { const m = String(s || '').match(/\b(\d{4})\b/); return m ? +m[1] : null; }
function fullName(p) { return [p.firstName, p.lastName].filter(Boolean).join(' ') || 'Unbekannt'; }
function trunc(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
function lifeSpan(p) {
  const b = yearOf(p.birthDate), d = yearOf(p.deathDate); const parts = [];
  if (b) parts.push('* ' + b);
  if (d) parts.push('† ' + d); else if (p.status === 'verstorben') parts.push('†');
  return parts.join('   ');
}
function byBirth(a, b) { return (yearOf(a.birthDate) || 9999) - (yearOf(b.birthDate) || 9999); }
function childrenOf(id) { return Object.values(data.persons).filter(c => c.father === id || c.mother === id).sort(byBirth); }
function siblingsOf(p) {
  // über gemeinsame Eltern ODER direkt als Geschwister verbunden (wenn die Eltern noch fehlen)
  // direkte Geschwister-Verbindungen, auch über mehrere Ecken (A–B und B–C → A, B, C sind Geschwister)
  const direct = new Set(), todo = [p.id];
  while (todo.length) {
    const cur = todo.pop(), q = P(cur); if (!q) continue;
    const nb = (q.siblings || []).filter(id => P(id));
    Object.values(data.persons).forEach(x => { if ((x.siblings || []).includes(cur)) nb.push(x.id); });
    nb.forEach(id => { if (id !== p.id && !direct.has(id)) { direct.add(id); todo.push(id); } });
  }
  return Object.values(data.persons).filter(s => s.id !== p.id && (direct.has(s.id) ||
    (p.father && s.father === p.father) || (p.mother && s.mother === p.mother))).sort(byBirth);
}
function sortedPersons() {
  return Object.values(data.persons).sort((a, b) =>
    (a.lastName + ' ' + a.firstName).localeCompare(b.lastName + ' ' + b.firstName, 'de'));
}
// Schutz: Lebende und alle, bei denen nicht klar ist, ob sie verstorben sind.
// Verstorbene (egal wann geboren) sind nicht geschützt.
function isDeceased(p) {
  const by = yearOf(p.birthDate);
  if (p.status === 'lebt') return false;
  if (p.status === 'verstorben' || p.deathDate || p.deathPlace) return true;
  return !!(by && by <= THIS_YEAR - PROTECT_YEARS);
}
function isProtected(p) { return !isDeceased(p); }
function linkify(text) {
  return esc(text).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function avatarHTML(p) {
  if (p.photo) return `<img class="avatar" src="${esc(p.photo)}" alt="">`;
  return `<div class="avatar g-${p.gender}">${esc((p.firstName || p.lastName || '?')[0].toUpperCase())}</div>`;
}

// ====================== Baum zeichnen ======================
const svg = document.getElementById('tree');
const vp = document.getElementById('viewport');
let view = { x: 0, y: 0, k: 1 };
let lastBox = null;

function applyView() { vp.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`); }

function renderTree(fit) {
  const ids = Object.keys(data.persons);
  document.getElementById('emptyHint').hidden = ids.length > 0;
  document.getElementById('fab').hidden = ids.length === 0;
  if (!ids.length) { vp.innerHTML = ''; return; }
  if (!P(data.focusId)) data.focusId = P(data.rootId) ? data.rootId : ids[0];
  if (!P(data.rootId)) data.rootId = data.focusId;

  const f = P(data.focusId);
  const rowH = CH + VG, step = CW + HG;
  const nodes = [], ghosts = [], lines = [], marks = [];

  // --- Vorfahren (nach oben) ---
  const anc = [[f.id]]; let maxG = 0;
  const seenAnc = new Set([f.id]);   // jede/n Vorfahr/in nur einmal zeigen (auch bei falschen/doppelten Verbindungen)
  const once = id => (id && !seenAnc.has(id) ? (seenAnc.add(id), id) : null);
  for (let g = 1; g <= MAX_ANCESTOR_GENS; g++) {
    const row = []; let any = false;
    for (const cid of anc[g - 1]) {
      const c = P(cid);
      const fa = once(c && P(c.father) ? c.father : null), mo = once(c && P(c.mother) ? c.mother : null);
      row.push(fa, mo); if (fa || mo) any = true;
    }
    if (!any) break;
    anc.push(row); maxG = g;
  }
  const total = Math.pow(2, Math.max(maxG, 1)) * step;
  const slotX = (g, i) => (i + 0.5) * (total / Math.pow(2, g)) - total / 2;
  const pos = {};
  for (let g = 0; g <= maxG; g++) anc[g].forEach((id, i) => {
    if (!id) return; const x = slotX(g, i), y = -g * rowH;
    pos[g + ':' + i] = { x, y }; nodes.push({ id, x, y, focus: g === 0 });
  });
  for (let g = 1; g <= maxG; g++) for (let ci = 0; ci < anc[g - 1].length; ci++) {
    const c = pos[(g - 1) + ':' + ci]; if (!c) continue;
    const ps = [pos[g + ':' + (2 * ci)], pos[g + ':' + (2 * ci + 1)]].filter(Boolean); if (!ps.length) continue;
    const midY = c.y - CH / 2 - VG / 2; const xs = ps.map(p => p.x).concat(c.x);
    let d = `M${c.x},${c.y - CH / 2}V${midY}M${Math.min(...xs)},${midY}H${Math.max(...xs)}`;
    ps.forEach(p => d += `M${p.x},${midY}V${p.y + CH / 2}`);
    lines.push(d);
  }

  // Ab hier (außer Vorfahren) jede Person nur einmal zeichnen – sonst erscheint z. B. jemand,
  // der versehentlich als Partner UND als Geschwister eingetragen ist, doppelt im Baum.
  const drawn = id => nodes.some(n => n.id === id);
  // --- Geschwister (links daneben, mit den Eltern verbunden) ---
  const fSp = (f.spouses || []).filter(id => P(id));
  const sibs = siblingsOf(f).filter(sb => !fSp.includes(sb.id) && !drawn(sb.id));
  const parentY = -CH / 2 - VG / 2;
  let cur = -step;
  sibs.slice().reverse().forEach(sb => {   // jüngste/älteste nach links, Partner jeweils noch weiter links daneben
    const x = cur; nodes.push({ id: sb.id, x, y: 0 });
    lines.push(`M${x},${-CH / 2}V${parentY}H0`);
    const m = (sb.spouses || []).map(P).filter(Boolean)[0];
    if (m && m.id !== f.id && !fSp.includes(m.id) && !drawn(m.id)) { nodes.push({ id: m.id, x: x - step, y: 0 }); lines.push(`M${x - CW / 2},0H${x - step + CW / 2}`); marks.push({ x: x - step / 2, y: -6 }); cur -= step; }
    cur -= step;
  });
  // Tanten/Onkel: Geschwister des Vaters links neben dem Vater, der Mutter rechts neben der Mutter
  [['father', -1], ['mother', 1]].forEach(([k, dir]) => {
    const par = P(f[k]); const pp = pos['1:' + (k === 'father' ? 0 : 1)]; if (!par || !pp) return;
    siblingsOf(par).filter(a => !nodes.some(n => n.id === a.id)).forEach((a, i) => {
      const x = pp.x + dir * (i + 1) * step, y = pp.y;
      nodes.push({ id: a.id, x, y });
      lines.push(`M${x},${y - CH / 2}V${y - CH / 2 - VG / 2}H${pp.x}`);
    });
  });

  // --- Partner (rechts daneben) ---
  const spouses = fSp.filter(id => !drawn(id));
  spouses.forEach((sid, j) => {
    const x = (j + 1) * step; nodes.push({ id: sid, x, y: 0 });
    lines.push(`M${j * step + CW / 2},0H${x - CW / 2}`);
    marks.push({ x: j * step + CW / 2 + HG / 2, y: -6 });
  });

  // --- Geschwister des Partners (rechts neben den Partnern, mit eigenem Verbindungsstrich) ---
  let rx = (spouses.length + 1) * step;
  spouses.forEach((sid, j) => {
    const sp = P(sid), sx = (j + 1) * step, barY = -CH / 2 - VG / 4;
    siblingsOf(sp).filter(a => a.id !== f.id && !nodes.some(n => n.id === a.id)).forEach(a => {
      nodes.push({ id: a.id, x: rx, y: 0 });
      lines.push(`M${rx},${-CH / 2}V${barY}H${sx}V${-CH / 2}`);
      const m = (a.spouses || []).map(P).filter(Boolean)[0];
      if (m && !nodes.some(n => n.id === m.id)) { nodes.push({ id: m.id, x: rx + step, y: 0 }); lines.push(`M${rx + CW / 2},0H${rx + step - CW / 2}`); marks.push({ x: rx + step / 2, y: -6 }); rx += step; }
      rx += step;
    });
  });

  // --- Nachkommen (nach unten) ---
  // Partner der Kinder/Enkel werden direkt daneben gezeigt (Paar = doppelte Breite)
  const mateOf = c => (c.spouses || []).map(P).filter(Boolean)[0] || null;
  const unitW = c => step * (mateOf(c) ? 2 : 1);
  const descW = (id, depth) => {
    const own = unitW(P(id));
    if (depth >= MAX_DESC_GENS) return own;
    const ch = childrenOf(id); if (!ch.length) return own;
    return Math.max(own, ch.reduce((s, c) => s + descW(c.id, depth + 1), 0));
  };
  const placeKids = (id, px, py, depth, startFn) => {
    if (depth >= MAX_DESC_GENS) return;
    const ch = childrenOf(id); if (!ch.length) return;
    const tot = ch.reduce((s, c) => s + descW(c.id, depth + 1), 0);
    let left = px - tot / 2; const y = py + rowH, midY = y - CH / 2 - VG / 2;
    ch.forEach(c => {
      const w = descW(c.id, depth + 1), center = left + w / 2; left += w;
      if (drawn(c.id)) return;   // schon gezeigt (z. B. als Partner/in eines Geschwisters)
      const mt = mateOf(c), mate = mt && !drawn(mt.id) ? mt : null, x = mate ? center - step / 2 : center;
      nodes.push({ id: c.id, x, y });
      if (mate) {
        nodes.push({ id: mate.id, x: center + step / 2, y });
        lines.push(`M${x + CW / 2},${y}H${center + step / 2 - CW / 2}`);
        marks.push({ x: center, y: y - 6 });
      }
      const s = startFn(c); lines.push(`M${s.x},${s.y}V${midY}H${x}V${y - CH / 2}`);
      placeKids(c.id, center, y, depth + 1, k => (mate && (k.father === mate.id || k.mother === mate.id)) ? { x: center, y } : { x, y: y + CH / 2 });
    });
  };
  const gapX = j => j * step + CW / 2 + HG / 2;
  const focusStart = c => {
    const other = c.father === f.id ? c.mother : c.father; const j = spouses.indexOf(other);
    return j >= 0 ? { x: gapX(j), y: 0 } : { x: 0, y: CH / 2 };
  };
  const kids = childrenOf(f.id);
  let kx = 0;
  if (kids.length && spouses.length) {
    const js = new Set(kids.map(c => spouses.indexOf(c.father === f.id ? c.mother : c.father)));
    if (js.size === 1) { const j = [...js][0]; if (j >= 0) kx = gapX(j); }
  }
  placeKids(f.id, kx, 0, 0, focusStart);

  // --- Zeichnen ---
  let out = lines.map(d => `<path class="line" d="${d}"/>`).join('');
  out += marks.map(m => `<text class="marry" x="${m.x}" y="${m.y}" text-anchor="middle">⚭</text>`).join('');
  out += ghosts.map(g => `<g class="ghost" data-add="${g.add}"><rect x="${g.x - CW / 2}" y="${g.y - CH / 2}" width="${CW}" height="${CH}" rx="12"/><text x="${g.x}" y="${g.y + 5}" text-anchor="middle">${g.label}</text></g>`).join('');
  out += nodes.map((n, i) => cardSVG(n, i)).join('');
  vp.innerHTML = out;

  const xs = nodes.concat(ghosts).map(n => n.x), ys = nodes.concat(ghosts).map(n => n.y);
  lastBox = { x1: Math.min(...xs) - CW / 2, x2: Math.max(...xs) + CW / 2, y1: Math.min(...ys) - CH / 2, y2: Math.max(...ys) + CH / 2 };
  if (fit) fitView(); else applyView();
}

function cardSVG(n, i) {
  const p = P(n.id), x = n.x - CW / 2, y = n.y - CH / 2;
  const hasPhoto = !!p.photo;
  const tx = hasPhoto ? x + 70 : n.x, anchor = hasPhoto ? 'start' : 'middle', max = hasPhoto ? 11 : 18;
  let s = `<g class="card g-${p.gender}${n.focus ? ' focus' : ''}" data-id="${p.id}">`;
  s += `<rect class="box" x="${x}" y="${y}" width="${CW}" height="${CH}" rx="12"/>`;
  if (hasPhoto) {
    s += `<clipPath id="cp${i}"><circle cx="${x + 36}" cy="${n.y}" r="27"/></clipPath>`;
    s += `<image href="${esc(p.photo)}" x="${x + 9}" y="${n.y - 27}" width="54" height="54" clip-path="url(#cp${i})" preserveAspectRatio="xMidYMid slice"/>`;
  }
  s += `<text class="t-first" x="${tx}" y="${n.y - 12}" text-anchor="${anchor}">${esc(trunc(p.firstName || '?', max))}</text>`;
  s += `<text class="t-last" x="${tx}" y="${n.y + 7}" text-anchor="${anchor}">${esc(trunc(p.lastName, max))}</text>`;
  s += `<text class="t-life" x="${tx}" y="${n.y + 27}" text-anchor="${anchor}">${esc(lifeSpan(p))}</text>`;
  if (isProtected(p)) s += `<text class="t-lock" x="${x + CW - 8}" y="${y + 17}" text-anchor="end">🔒</text>`;
  return s + '</g>';
}

function fitView() {
  if (!lastBox) return;
  const r = svg.getBoundingClientRect(), pad = 30;
  const bw = lastBox.x2 - lastBox.x1, bh = lastBox.y2 - lastBox.y1;
  view.k = Math.max(0.45, Math.min(1.1, Math.min((r.width - pad * 2) / bw, (r.height - pad * 2) / bh)));
  const fitsW = bw * view.k <= r.width - pad, fitsH = bh * view.k <= r.height - pad;
  const cx = fitsW ? (lastBox.x1 + lastBox.x2) / 2 : 0;
  const cy = fitsH ? (lastBox.y1 + lastBox.y2) / 2 : 0;
  view.x = r.width / 2 - cx * view.k; view.y = r.height / 2 - cy * view.k;
  applyView();
}
function zoomAt(factor, sx, sy) {
  const k = Math.max(0.2, Math.min(3, view.k * factor));
  const wx = (sx - view.x) / view.k, wy = (sy - view.y) / view.k;
  view.k = k; view.x = sx - wx * k; view.y = sy - wy * k; applyView();
}

  else if (pointers.size === 2) {
    if (down) down.moved = true;
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: view.k, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, vx: view.x, vy: view.y };

  if (pointers.size === 2 && pinch) {
    const [a, b] = [...pointers.values()];
    const k = Math.max(0.2, Math.min(3, pinch.k * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d));
    const wx = (pinch.mx - r.left - pinch.vx) / pinch.k, wy = (pinch.my - r.top - pinch.vy) / pinch.k;

// Nach einem Tipp im Baum schickt das Handy noch einen „Klick“ hinterher. Der würde sonst in der gerade

// Nur für ungeschützte Personen. Öffnet freie Quellen mit vorausgefülltem Namen
// und erstellt einen fertigen Text für die Claude-App.
function googleUrl(p) {
  const name = [p.firstName, p.lastName].filter(Boolean).join(' ');
  return 'https://www.google.com/search?q=' + encodeURIComponent(['"' + name + '"', p.birthPlace].filter(Boolean).join(' '));
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e2) {} ta.remove(); return ok;
  }
}
function researchSources(p) {
  const fn = p.firstName.split(/\s+/)[0] || '', ln = p.birthName || p.lastName || '';
  const name = [p.firstName, ln].filter(Boolean).join(' ');
  const by = yearOf(p.birthDate), dy = yearOf(p.deathDate);
  const place = p.birthPlace || p.deathPlace || '';
  const e = encodeURIComponent;
  const inRange = (y, a, b) => y && y >= a && y <= b;
  const lived = (a, b) => (by || 0) <= b && (dy || (by ? by + 70 : 9999)) >= a;   // lebte (vermutlich) in diesem Zeitraum
  const list = [];
  let fs = `https://www.familysearch.org/search/record/results?q.givenName=${e(p.firstName)}&q.surname=${e(ln)}`;
  if (by) fs += `&q.birthLikeDate.from=${by - 2}&q.birthLikeDate.to=${by + 2}`;
  if (p.birthPlace) fs += `&q.birthLikePlace=${e(p.birthPlace)}`;
  if (dy) fs += `&q.deathLikeDate.from=${dy - 2}&q.deathLikeDate.to=${dy + 2}`;
  list.push({ name: 'FamilySearch', what: 'Riesige Sammlung von Kirchenbüchern und Registern weltweit. Kostenlos, Anmeldung nötig.', url: fs, top: true });
  list.push({ name: 'GEDBAS (CompGen)', what: 'Stammbäume, die andere Familienforscher veröffentlicht haben. Kostenlos.', url: `https://gedbas.genealogy.net/search/simple?firstname=${e(fn)}&lastname=${e(ln)}`, top: true });
  if (place) list.push({ name: 'GenWiki: ' + place, what: 'Infos zum Ort: zuständige Pfarrei, Ortsfamilienbuch, Archive, Adressbücher. Kostenlos.', url: `https://wiki.genealogy.net/index.php?search=${e(place)}`, top: true });
  list.push({ name: 'Online-Ortsfamilienbücher', what: 'Ganze Dörfer mit allen Familien aus Kirchenbüchern zusammengestellt. Kostenlos.', url: 'https://www.online-ofb.de/', top: !!place });
  list.push({ name: 'Matricula', what: 'Katholische Kirchenbücher als Bilder, nach Ort/Pfarrei. Kostenlos.', url: 'https://data.matricula-online.eu/de/', top: !!place });
  list.push({ name: 'Archion', what: 'Evangelische Kirchenbücher als Bilder, nach Ort/Pfarrei. Kostenpflichtig.', url: 'https://www.archion.de/', top: false });
  const ww = inRange(dy, 1914, 1919) || inRange(dy, 1939, 1946) || (!dy && (lived(1914, 1918) || lived(1939, 1945)));
  if (p.gender !== 'w' && (inRange(dy, 1914, 1919) || (!dy && inRange(by, 1865, 1901))))
    list.push({ name: 'Verlustlisten 1. Weltkrieg', what: 'Gefallene, Verwundete und Vermisste 1914–1919. Kostenlos.', url: 'https://wiki.genealogy.net/Verlustlisten_Erster_Weltkrieg', top: true });
  list.push({ name: 'Volksbund Gräbersuche', what: 'Kriegstote beider Weltkriege. Kostenlos.', url: 'https://www.volksbund.de/erinnern-gedenken/graebersuche-online', top: ww });
  list.push({ name: 'Arolsen Archives', what: 'Verfolgte, Zwangsarbeiter, Displaced Persons (1933–1950). Kostenlos.', url: `https://collections.arolsen-archives.org/de/search?s=${e(name)}`, top: lived(1933, 1950) && (!by || by > 1860) });
  list.push({ name: 'Zeitungsportal (DDB)', what: 'Alte Zeitungen, z. B. Todes- und Heiratsanzeigen. Kostenlos.', url: `https://www.deutsche-digitale-bibliothek.de/search/newspaper?query=${e('"' + name + '"')}`, top: lived(1850, 1950) });
  list.push({ name: 'Find a Grave', what: 'Grabsteine weltweit, viele Auswanderer (USA). Kostenlos.', url: `https://www.findagrave.com/memorial/search?firstname=${e(fn)}&lastname=${e(ln)}${by ? '&birthyear=' + by : ''}${dy ? '&deathyear=' + dy : ''}`, top: false });
  list.push({ name: 'Google', what: 'Allgemeine Websuche nach Name, Ort und Jahr.', url: `https://www.google.com/search?q=${e(['"' + name + '"', place, by || ''].filter(Boolean).join(' '))}`, top: false });
  return list;
}

// Abgehakte Vorschläge übernehmen (Felder setzen, neue Verwandte anlegen und verknüpfen, Quellen notieren)
function applySuggestions(p, chosen) {
  const result = { created: [], updated: 0, errors: 0 };
  // Quellen sammeln: pro Person und Quelle nur eine Zeile („Geburtsdatum, Sterbeort: Link (sicher)“)
  const groups = new Map();
  const srcLine = (q, what, s) => {
    if (!s.source) return; const k = q.id + '|' + s.source + '|' + s.sure;

    const q = P(s.target); q[s.field] = s.value; result.updated++;

    if (s.field !== 'gender') srcLine(q, FIELD_LABEL[s.field], s);
  } catch (e) { console.warn('feld', e); result.errors++; } });

    const np = newPerson({ firstName: d.firstName || '', lastName: d.lastName || '', birthName: d.birthName || '',

    if (s.rename) ['firstName', 'lastName', 'birthName'].forEach(f => { if ((s.rename[f] || '') !== (ex[f] || '')) { ex[f] = s.rename[f]; result.renamed = (result.renamed || 0) + 1; } }); const g = (REL_BY[s.rel] || REL_BY.none)[3]; if (g && ex.gender === 'u') ex.gender = g; });

  news.concat(links).sort((a, b) => ord[(REL_BY[a.rel] || REL_BY.none)[2]] - ord[(REL_BY[b.rel] || REL_BY.none)[2]]).forEach(s => { try {
    const np = made[s.idx]; if (!np) return;
    const kind = (REL_BY[s.rel] || REL_BY.none)[2], T = target(s);

      if ((kind === 'sibling' || kind === 'parent') && (p.spouses || []).includes(T.id)) {

        if (np.father && (p.spouses || []).includes(np.father) && kind === 'sibling') np.father = null;
        if (np.mother && (p.spouses || []).includes(np.mother) && kind === 'sibling') np.mother = null;
      }
      const already = (kind === 'spouse' && (np.spouses || []).includes(T.id)) || (kind === 'child' && (np.father === T.id || np.mother === T.id))
        || (kind === 'parent' && (T.father === np.id || T.mother === np.id)) || (kind === 'sibling' && siblingsOf(T).includes(np));

// ---- Wikipedia/Wikidata: zu einem Wikipedia-Link die fertigen Daten (Geburt, Tod, Eltern …) abrufen ----
// Wikipedia erlaubt diese Abfragen direkt aus dem Browser (origin=*). Andere Webseiten erlauben das nicht.
function wikiFromUrl(url) {
  const m = String(url || '').match(/^https?:\/\/([a-z-]+)(?:\.m)?\.wikipedia\.org\/wiki\/([^?#]+)/i);
  return m ? { lang: m[1].toLowerCase(), title: decodeURIComponent(m[2]).replace(/_/g, ' ') } : null;
}
async function wdGet(params) {
  const q = new URLSearchParams(Object.assign({ format: 'json', origin: '*' }, params));
  const r = await fetch('https://www.wikidata.org/w/api.php?' + q); if (!r.ok) throw new Error('wikidata'); return r.json();
}
async function wdEntities(ids, props, lang) {
  const out = {};
  for (let i = 0; i < ids.length; i += 45) {
    const j = await wdGet({ action: 'wbgetentities', ids: ids.slice(i, i + 45).join('|'), props, languages: lang + '|de|en' });
    Object.assign(out, j.entities || {});
  }
  return out;
}
function wdDate(claims, pid) {
  const v = claims && claims[pid] && claims[pid][0] && claims[pid][0].mainsnak.datavalue;
  if (!v || !v.value || !v.value.time) return '';
  const m = v.value.time.match(/^\+?(\d{4})-(\d{2})-(\d{2})/); if (!m) return '';
  const pr = v.value.precision;
  return pr >= 11 ? `${m[3]}.${m[2]}.${m[1]}` : pr === 10 ? `${m[2]}.${m[1]}` : pr === 9 ? m[1] : '';
}
function wdIds(claims, pid) {
  return ((claims && claims[pid]) || []).map(c => c.mainsnak.datavalue && c.mainsnak.datavalue.value && c.mainsnak.datavalue.value.id).filter(Boolean);
}
function wdLabel(ent, lang) {
  if (!ent || !ent.labels) return '';
  return (ent.labels[lang] || ent.labels.de || ent.labels.en || {}).value || '';
}
// Liefert Zeilen im gleichen Format wie STAMMBAUM-DATEN (key/value), dazu den Namen aus Wikipedia
async function wikiItems(url) {
  const w = wikiFromUrl(url); if (!w) return null;
  const q = new URLSearchParams({ action: 'query', prop: 'pageprops', titles: w.title, redirects: '1', format: 'json', origin: '*' });
  const r = await fetch(`https://${w.lang}.wikipedia.org/w/api.php?` + q); if (!r.ok) throw new Error('wikipedia');
  const pages = ((await r.json()).query || {}).pages || {};
  const page = Object.values(pages)[0] || {};
  const qid = page.pageprops && page.pageprops.wikibase_item; if (!qid) return { items: [], name: page.title || w.title };
  const main = (await wdEntities([qid], 'claims|labels', w.lang))[qid]; const c = main.claims || {};
  const rel = { VATER: wdIds(c, 'P22'), MUTTER: wdIds(c, 'P25'), EHEPARTNER: wdIds(c, 'P26'), KIND: wdIds(c, 'P40'), GESCHWISTER: wdIds(c, 'P3373') };
  const relIds = [].concat(...Object.values(rel)).slice(0, 40);
  const relEnt = relIds.length ? await wdEntities(relIds, 'claims|labels', w.lang) : {};
  const placeIds = new Set(wdIds(c, 'P19').concat(wdIds(c, 'P20'), wdIds(c, 'P106').slice(0, 3)));
  Object.values(relEnt).forEach(e => { wdIds(e.claims, 'P19').concat(wdIds(e.claims, 'P20')).forEach(x => placeIds.add(x)); });
  const lab = placeIds.size ? await wdEntities([...placeIds], 'labels', w.lang) : {};
  const L = id => wdLabel(lab[id], w.lang);
  const ev = (d, placeId) => [d, placeId && L(placeId) ? 'in ' + L(placeId) : ''].filter(Boolean).join(' ');
  const items = [];
  const bd = wdDate(c, 'P569'), dd = wdDate(c, 'P570'), bp = wdIds(c, 'P19')[0], dp = wdIds(c, 'P20')[0];
  if (bd || bp) items.push({ key: 'GEBURT', value: ev(bd, bp) });
  if (dd || dp) items.push({ key: 'TOD', value: ev(dd, dp) });
  const jobs = wdIds(c, 'P106').slice(0, 3).map(L).filter(Boolean);
  if (jobs.length) items.push({ key: 'BERUF', value: jobs.join(', ') });
  Object.entries(rel).forEach(([key, ids]) => ids.forEach(id => {
    const e = relEnt[id]; if (!e) return; const ec = e.claims || {};
    const name = wdLabel(e, w.lang); if (!name) return;
    const parts = [name];
    const b = ev(wdDate(ec, 'P569'), wdIds(ec, 'P19')[0]), d = ev(wdDate(ec, 'P570'), wdIds(ec, 'P20')[0]);
    if (b) parts.push('geboren ' + b); if (d) parts.push('gestorben ' + d);
    items.push({ key, value: parts.join(', ') });
  }));
  const g = wdIds(c, 'P21')[0];
  // Zusätzlich den Artikeltext holen: dort stehen Ehefrau und Kinder oft, auch wenn Wikidata sie nicht kennt
  let text = '';
  try {
    const q2 = new URLSearchParams({ action: 'query', prop: 'extracts', explaintext: '1', titles: page.title || w.title, redirects: '1', format: 'json', origin: '*' });
    const r2 = await fetch(`https://${w.lang}.wikipedia.org/w/api.php?` + q2);
    text = (Object.values(((await r2.json()).query || {}).pages || {})[0] || {}).extract || '';
  } catch (e) {}
  return { items, text, name: wdLabel(main, w.lang) || page.title, gender: g === 'Q6581097' ? 'm' : g === 'Q6581072' ? 'w' : '' };
}

// ====================== Texterkennung aus Bildern (OCR) – läuft direkt im Handy ======================
// Die Erkennungs-Software (Tesseract) wird beim ersten Mal aus einem öffentlichen Programm-Verzeichnis
// (jsDelivr) geladen und danach vom Browser gespeichert. Das Bild selbst verlässt das Handy nicht.
const OCR_CDN = 'https://cdn.jsdelivr.net/npm/';
let ocrWorker = null, ocrProgress = null;
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('script')); document.head.appendChild(s); });
}
// Bild vorbereiten: kleine Bilder vergrößern, in Graustufen umwandeln (verbessert die Erkennung)
function prepareImage(blob) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(blob);
    img.onload = () => {
      // nur sehr kleine Bilder vergrößern; sonst unverändert (Filter verschlechtern Schreibschrift eher)
      const k = img.width < 700 ? Math.min(2.5, 1200 / img.width) : 1;
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bild')); };
    img.src = url;
  });
}
async function ocrImage(blob, onProgress) {
  ocrProgress = onProgress || null;
  if (!window.Tesseract) await loadScript(OCR_CDN + 'tesseract.js@5.1.1/dist/tesseract.min.js');
  if (!ocrWorker) ocrWorker = await Tesseract.createWorker('deu', 1, {
    workerPath: OCR_CDN + 'tesseract.js@5.1.1/dist/worker.min.js',
    corePath: OCR_CDN + 'tesseract.js-core@5.1.1',
    langPath: OCR_CDN + '@tesseract.js-data/deu/4.0.0_best_int',
    logger: m => { if (ocrProgress) ocrProgress(m); }
  });
  const { data } = await ocrWorker.recognize(await prepareImage(blob));
  return data.text || '';
}
// Typische Lesefehler bei Namen korrigieren („Kral“ → „Karl“, „Arnna“ → „Anna“)
function ocrFixWord(w, pool) {
  if (!w || w.length < 4 || pool.has(w)) return w;
  let best = null, bd = 99;
  pool.forEach(k => { if (Math.abs(k.length - w.length) > 2) return; const d = lev(w, k); if (d < bd) { bd = d; best = k; } });
  return best && bd <= (w.length >= 5 ? 2 : 1) ? best : w;
}
function ocrNamePools() {
  const first = new Set(FIRST_SET), last = new Set();
  Object.values(data.persons).forEach(q => {
    String(q.firstName || '').split(/\s+/).forEach(x => x.length > 2 && first.add(x));
    [q.lastName, q.birthName].forEach(x => x && last.add(x));
  });
  return { first, last };
}

// ---- Beliebige Webseite / PDF auslesen ----
// Der Browser darf fremde Seiten nicht selbst lesen. Deshalb holt ein öffentlicher Lese-Dienst (Jina Reader)

  doc.querySelectorAll('br,p,div,li,h1,h2,h3,h4,tr').forEach(x => x.append('\n'));

}

    if (!r.ok) throw new Error('read ' + r.status);

  // Text ohne die Verwandten-Stellen (damit z. B. „geborene Hofmann“ der Mutter nicht der Person zugeordnet wird)
  let rest = t; spans.forEach(x => { rest = rest.replace(x, '. '); });
  const ob = rest.search(/In\s+(?:Liebe|stiller\s+Trauer|tiefer\s+Trauer|Dankbarkeit)|Es\s+trauern/i);
  if (ob >= 0) rest = rest.slice(0, ob);   // Unterschriften der Traueranzeige gehören nicht zur Person
  items.rest = rest;
  return items;
}

Person: ${personLine(p)}

${text ? `Gefundener Text${url ? ' (Quelle: ' + url + ')' : ''}:

Bitte prüfe, ob der Fund wirklich zu dieser Person passt (Achtung Namensvettern!), und erkläre kurz, warum. Erfinde nichts.

}
function addFinding(id, pre = {}) {
  const p = P(id); if (!p) return;
  const prot = isProtected(p);
  const firstUrl = t => (String(t || '').match(/https?:\/\/[^\s"<>]+/) || [''])[0];

    <label>Wie sicher passt das zu ${esc(p.firstName || 'der Person')}?</label>
    <div class="seg" id="fSure"><button type="button" data-v="sicher">sicher</button><button type="button" data-v="wahrscheinlich" class="on">wahrscheinlich</button><button type="button" data-v="unsicher">unsicher</button></div>
    <button class="btn primary" id="fWiki" style="width:100%;margin-top:12px" hidden>📖 Daten aus Wikipedia holen</button>
    <button class="btn primary" id="fRead" style="width:100%;margin-top:12px" hidden>🌐 Seite / PDF auslesen</button>
    <div class="research locked" id="fImgHint" hidden>🖼️ <b>Die Anzeige ist vermutlich ein Bild</b> (oder das ist eine Übersichtsseite). Ich versuche, das Bild selbst zu lesen. Klappt das nicht:
      Anzeige groß öffnen, <b>Screenshot</b> machen, dann hier <b>„📷 Bild auslesen“</b> antippen und den Screenshot wählen – oder den Screenshot aus der Galerie über <b>Teilen → Stammbaum</b> schicken.</div>
    <div id="fSnips"></div>
    <div class="hint" id="fWikiMsg"></div>
    <button class="btn primary" id="fParse" style="width:100%;margin-top:12px">🔍 Daten im Text erkennen</button>
    ${prot ? '' : '<button class="btn" id="fClaude" style="width:100%;margin-top:8px">🤖 Lieber von Claude prüfen lassen</button>'}
    <div id="fOut"></div>
    <div class="actions"><button class="btn" id="cancel">Abbrechen</button><button class="btn primary" id="ok">💾 Speichern</button></div>
    <div class="toast" id="toast" hidden></div>`);
  let sure = 'wahrscheinlich', sugs = [], wiki = null;
  const T = () => dlg.querySelector('#fText').value.trim(), SRC = () => dlg.querySelector('#fSrc').value.trim();
  const toast = msg => { const t = dlg.querySelector('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 4000); };
  dlg.querySelectorAll('#fSure button').forEach(b => b.onclick = () => {
    sure = b.dataset.v; dlg.querySelectorAll('#fSure button').forEach(x => x.classList.toggle('on', x === b));
    if (sugs.length) parse();
  });
  const parse = () => {
    const out = dlg.querySelector('#fOut'), text = T().replace(/https?:\/\/\S+/g, ' ');
    const prevState = rememberSugs(out, sugs);
    if (!text && !wiki) { out.innerHTML = ''; return; }
    // Für Verwandte einen großen Bereich auswerten: bei einer gelesenen Seite ab der gewählten Stelle bis ca. 2500 Zeichen weiter
    let relText = wiki ? (wiki.text || '') : text;
    if (!wiki && pageText && T() === lastSnippet.trim()) relText = pageText.slice(Math.max(0, snipPos - 300), snipPos + 2500);
    const trg = relText.search(/In\s+(?:Liebe|stiller\s+Trauer|tiefer\s+Trauer|Dankbarkeit)|Es\s+trauern/i);
    if (trg >= 0) { const stop = relText.slice(trg).search(/Trauerfeier|Beerdigung|Beisetzung|Urnenbeisetzung|Weitere Anzeige|Traueradresse|Kondolenz/i); if (stop > 0) relText = relText.slice(0, trg + stop); }
    OCR_MODE = !!lastOcr && T() === lastOcr;
    const relItems = extractRelatives(relText, p);
    OCR_MODE = false;
    // Sicherheitsnetz: alle weiteren Namen im Text (Verwandtschaft unbekannt, nicht vorab angehakt)
    (listPage && T() === lastSnippet.trim() ? [] : namesInText(relText, p)).forEach(({ name, guessed, first }) => {
      const r = parseSpoken(name);
      if (sameName(p, r) || relItems.some(y => sameName(parseSpoken(y.value), r))) return;
      // nur Vorname im Text („mit Klaus“) und schon als Verwandter erkannt → nicht doppelt
      if (guessed && relItems.some(y => y.value.split(/\s+/)[0] === first)) return;
      relItems.push({ key: 'ANDERE', value: name, sure: 'unsicher', relLabel: 'Name im Text – Verwandtschaft unbekannt' });
    });
    const r = wiki ? {} : parseSpoken(relItems.rest || text), items = wiki ? wiki.items.map(x => Object.assign({}, x)) : [];
    if (wiki) { const n = parseSpoken(wiki.name); r.firstName = n.firstName; r.lastName = n.lastName; }
    const ev = (d, pl) => [d, pl ? 'in ' + pl : ''].filter(Boolean).join(' ');
    if (r.birthDate || r.birthPlace) items.push({ key: 'GEBURT', value: ev(r.birthDate, r.birthPlace) });
    if (r.deathDate || r.deathPlace) items.push({ key: 'TOD', value: ev(r.deathDate, r.deathPlace) });
    if (r.occupation) items.push({ key: 'BERUF', value: r.occupation });
    if (r.birthName) items.push({ key: 'GEBURTSNAME', value: r.birthName });
    relItems.forEach(x => items.push(x));
    items.forEach(it => { it.sure = it.sure || sure; it.source = SRC(); });
    sugs = buildSuggestions(p, items); sugs.mainId = p.id;
    if (wiki && wiki.gender && p.gender === 'u') sugs.unshift({ type: 'field', target: p.id, field: 'gender', value: wiki.gender, old: '', checked: true, sure, source: SRC() });
    // Namensprüfung nur mit dem Anfang des Textes (bis zum ersten Komma/Punkt) und nur, wenn das wirklich ein Name ist
    const frag = (wiki ? wiki.name : text).trim().split(/[,.;:\n(*†]|\s(?:geboren|gestorben|geborene)\b/)[0].trim();
    const fw = frag.split(/\s+/).filter(Boolean);
    const plausible = fw.length >= 2 && fw.length <= 4 && fw.every(w => /^[A-ZÄÖÜ]/.test(w) || PARTICLES.includes(w));
    const fr = plausible ? parseSpoken(frag) : {};
    const other = plausible && fr.firstName && !sameName(p, fr)
      ? `<div class="research locked">⚠️ Im Text steht <b>${esc(frag)}</b> – ist das wirklich ${esc(fullName(p))}?</div>` : '';
    if (other) sugs.forEach(x => x.checked = false);   // anderer Name: nichts vorab anhaken
    restoreSugs(sugs, prevState);   // Haken und Rollen, die der Nutzer schon gesetzt hat, behalten
    out.innerHTML = other + (sugs.length ? renderSugs(sugs)
      : `<div class="research open">Ich habe keine neuen Daten erkannt (ausgewertet: ${(wiki ? (wiki.text || '').length : (pageText || text).length)} Zeichen). Der Text wird trotzdem als Notiz gespeichert.` + (prot ? '' : ' Bei längeren Texten hilft „Von Claude prüfen lassen“.') + '</div>');
  };
  dlg.querySelector('#fParse').onclick = () => {
    wiki = null;
    // Nur Titel oder leer, aber ein Link vorhanden → die Seite selbst auslesen
    const weak = !T() || (!/\d/.test(T()) && T().length < 120);
    if (weak && wikiFromUrl(SRC())) { loadWiki(); return; }
    if (weak && isUrl(SRC())) { readUrl().then(() => rBtn.disabled = false); return; }
    if (!T()) { dlg.querySelector('#fOut').innerHTML = '<div class="research locked">Im Feld „Gefundener Text“ steht noch nichts. Bitte Text einfügen (markieren → Kopieren → „📋 Aus Zwischenablage einfügen“).</div>'; }
    else parse();
    dlg.querySelector('#fOut').scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  // Wikipedia-Link erkannt → Daten direkt abrufen
  const wBtn = dlg.querySelector('#fWiki'), wMsg = dlg.querySelector('#fWikiMsg');
  const loadWiki = async () => {
    wMsg.textContent = '⏳ Hole Daten aus Wikipedia …';
    try {
      const res = await wikiItems(SRC());
      if (!res || (!res.items.length && !res.text)) { wMsg.textContent = 'In Wikipedia/Wikidata stehen zu diesem Artikel keine Lebensdaten.'; return; }
      wiki = res; wMsg.textContent = `✓ Daten zu „${res.name}“ gefunden (${res.items.length}).`; parse();
    } catch (e) { console.warn('wiki', e); wMsg.textContent = 'Wikipedia ist gerade nicht erreichbar. Alternativ: Text im Artikel markieren und kopieren.'; }
  };
  const rBtn = dlg.querySelector('#fRead'), snipBox = dlg.querySelector('#fSnips');
  const isUrl = u => /^https?:\/\//i.test(u);
  let pageText = '', snipPos = 0, lastSnippet = '', listPage = false;
  const imageHint = dlg.querySelector('#fImgHint');
  // ---- Bild auslesen (Texterkennung im Handy) ----
  let lastOcr = '';
  const ocrMsg = dlg.querySelector('#fOcrMsg');
  const runOcr = async (blob, label) => {
    ocrMsg.innerHTML = '<div class="research open">⏳ Lese ' + (label || 'das Bild') + ' … <span id="ocrPct"></span><br><small>Beim ersten Mal wird die Texterkennung geladen (ca. 4 MB), das dauert etwas.</small></div>';
    ocrMsg.scrollIntoView({ behavior: 'smooth', block: 'center' });
    try {
      const txt = await ocrImage(blob, m => { const e = dlg.querySelector('#ocrPct'); if (e && m.progress != null) e.textContent = (m.status === 'recognizing text' ? 'Text erkennen: ' : 'Vorbereiten: ') + Math.round(m.progress * 100) + ' %'; });
      if (!txt.trim()) { ocrMsg.innerHTML = '<div class="research locked">Im Bild wurde kein Text gefunden.</div>'; return false; }
      lastOcr = txt.trim(); dlg.querySelector('#fText').value = lastOcr; wiki = null;
      ocrMsg.innerHTML = '<div class="research open">✓ Text aus dem Bild gelesen. Bitte die Vorschläge prüfen – bei Schreibschrift sind Namen und Daten nicht immer richtig.</div>';
      parse(); dlg.querySelector('#fOut').scrollIntoView({ behavior: 'smooth', block: 'start' });
      return true;
    } catch (e) {
      console.warn('ocr', e);
      ocrMsg.innerHTML = '<div class="research locked">Die Texterkennung konnte nicht geladen werden (Internet nötig beim ersten Mal). Bitte später noch einmal versuchen.</div>';
      return false;
    }
  };
  dlg.querySelector('#fImg').onclick = () => dlg.querySelector('#fImgIn').click();
  dlg.querySelector('#fImgIn').onchange = e => { const f = e.target.files[0]; if (f) runOcr(f, 'den Screenshot'); };
  // Bild auf der gelesenen Seite selbst suchen und lesen (z. B. Traueranzeige als Bild)
  const ocrPageImages = async imgs => {
    for (const u of imgs.slice(0, 3)) {
      try {
        let r = await fetchTimeout(u, {}, 20000).catch(() => null);
        if (!r || !r.ok) r = await fetchTimeout('https://api.allorigins.win/raw?url=' + encodeURIComponent(u), {}, 25000);
        if (!r.ok) continue;
        const blob = await r.blob(); if (blob.size < 15000 || !/image/.test(blob.type || 'image')) continue;
        if (await runOcr(blob, 'das Bild der Anzeige')) {
          // passt das Bild? (Name der Person oder typische Wörter einer Anzeige)
          const ln = (p.lastName || p.birthName || '').toLowerCase();
          if ((ln && lastOcr.toLowerCase().includes(ln)) || /trauer|abschied|†|\*\s*\d/i.test(lastOcr)) return true;
        }
      } catch (e) { console.warn('img', e); }
    }
    return false;
  };   // ganzer Seitentext (für Verwandte/Traueranzeigen weiter unten)
  const useSnippet = x => { lastSnippet = x.text.replace(/^… | …$/g, ''); snipPos = x.start; dlg.querySelector('#fText').value = lastSnippet; wiki = null; parse(); };
  const readUrl = async () => {
    imageHint.hidden = true;
    snipBox.innerHTML = '<div class="research open">⏳ Lese die Seite … (kann bei PDFs bis zu 30 Sekunden dauern)</div>';
    rBtn.disabled = true; snipBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
    try {
      const text = await readPage(SRC());
      const pageImages = lastPageImages.slice();
      const sn = findSnippets(p, text);
      pageText = text;
      // Übersichtsseite (viele Anzeigen) oder Anzeige als Bild? Dann gibt es keinen lesbaren Anzeigentext
      listPage = (text.match(/Traueranzeigen?\s+von\s/gi) || []).length >= 3 || /share\.google|google\.[a-z.]+\/(search|imgres)/i.test(SRC());
      const hasDates = sn.some(x => /\d{1,2}\.\s?\d{1,2}\.\s?\d{4}|[*†]\s*\d/.test(x.text));
      imageHint.hidden = !(listPage || !hasDates);
      if (!imageHint.hidden && pageImages.length && !listPage) { await ocrPageImages(pageImages); return; }
      if (!sn.length && lastPageImages.length) { snipBox.innerHTML = ''; imageHint.hidden = false; await ocrPageImages(lastPageImages.slice()); return; }
      if (!sn.length) {
        snipBox.innerHTML = `<div class="research locked">Der Name ${esc(p.lastName || p.birthName || '')} kommt auf der Seite nicht vor (oder die Seite ist ein Bild/Scan).` + (prot ? '' : ' Tipp: „🤖 Lieber von Claude prüfen lassen“.') + '</div>';
        return;
      }
      snipBox.innerHTML = `<h3>Stellen mit „${esc(p.lastName || p.birthName)}“ (${sn.length})</h3><p class="hint">Die beste Stelle ist schon übernommen. Passt eine andere besser? Einfach antippen.</p>`
        + sn.map((x, i) => `<div class="snip" data-s="${i}">${esc(x.text)}</div>`).join('');
      snipBox.querySelectorAll('[data-s]').forEach(d => d.onclick = () => {
        snipBox.querySelectorAll('.snip').forEach(x => x.classList.toggle('on', x === d)); useSnippet(sn[+d.dataset.s]);
      });
      snipBox.querySelector('.snip').classList.add('on'); useSnippet(sn[0]);
      const o = dlg.querySelector('#fOut'); (o.querySelector('label.sug') ? o : snipBox).scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (e) {
      console.warn('read', e);
      snipBox.innerHTML = '<div class="research locked">Die Seite konnte nicht gelesen werden (manche Seiten sperren das oder brauchen eine Anmeldung). Dann bitte den Text markieren und kopieren/teilen.' + (prot ? '' : ' Oder „🤖 Lieber von Claude prüfen lassen“.') + '</div>';
    }
  };
  rBtn.onclick = async () => { await readUrl(); rBtn.disabled = false; };
  const checkWiki = () => { wBtn.hidden = !wikiFromUrl(SRC()); rBtn.hidden = !isUrl(SRC()) || !!wikiFromUrl(SRC()); };
  dlg.querySelector('#fSrc').addEventListener('input', checkWiki);
  wBtn.onclick = loadWiki;
  checkWiki();
  dlg.querySelector('#fPaste').onclick = async () => {
    try { const t = await navigator.clipboard.readText(); if (t) { dlg.querySelector('#fText').value = t.trim(); if (!SRC()) dlg.querySelector('#fSrc').value = firstUrl(t); parse(); return; } } catch (e) {}
    dlg.querySelector('#fText').focus();
  };
  const cl = dlg.querySelector('#fClaude');
  if (cl) cl.onclick = async () => {
    if (!T() && !SRC()) { alert('Bitte zuerst den gefundenen Text oder Link einfügen.'); return; }
    const ok = await copyText(findingPrompt(p, T(), SRC()));
    window.open('https://claude.ai/new', '_blank', 'noopener');
    toast(ok ? '✓ Text kopiert – in Claude einfügen. Die Antwort dann über „Recherche → Claude-Antwort einfügen“ übernehmen.' : 'Kopieren hat nicht geklappt.');
  };
  dlg.querySelector('#cancel').onclick = () => prot ? (closeModal(), openDetail(id)) : openResearch(id);
  dlg.querySelector('#ok').onclick = () => {
    const t = T(), s = SRC();
    if (!t && !s) { alert('Bitte etwas eintragen.'); return; }
    const chosen = collectChosen(dlg.querySelector('#fOut'), sugs);
    const res = applySuggestions(p, chosen);
    const date = new Date().toLocaleDateString('de-DE');
    const short = t.length > 800 ? t.slice(0, 800) + ' …' : t;
    // Nur der Seitentitel (z. B. „Max Muster – Wikipedia“) ist keine Notiz wert
    const titleOnly = /^https?:/i.test(s) && (t === (pre.title || '').trim() || (!/\d/.test(t) && t.length < 120));
    if (t && !titleOnly && !hasNote(p, short)) p.notes = (p.notes ? p.notes + '\n\n' : '') + `[Fund ${date}, ${sure}] ${short}`;
    if (s && !String(p.sources || '').includes(s)) p.sources = (p.sources ? p.sources + '\n' : '') + s;
    save(); closeModal(); refresh(); showSaveResult(p, res);
  };
  // Geteilte Seite ohne markierten Text → automatisch auslesen
  const onlyTitle = !pre.text || pre.text.length < 80;
  if (pre.image) runOcr(pre.image, 'das geteilte Bild');
  else if (wikiFromUrl(SRC())) loadWiki();
  else if (isUrl(SRC()) && pre.url && onlyTitle) readUrl().then(() => rBtn.disabled = false);
  else if (preText) parse();
}

function pickPersonFor(pre) {
  const list = sortedPersons();
  if (!list.length) { alert('Lege zuerst eine Person an.'); return; }
  // Personen, deren Name im geteilten Text vorkommt, nach oben
  const txt = [pre.title, pre.text].join(' ').toLowerCase();
  const named = list.filter(p => p.firstName && txt.includes(p.firstName.split(/\s+/)[0].toLowerCase()) && [p.lastName, p.birthName].some(n => n && txt.includes(n.toLowerCase())));
  const recent = named.concat([P(sheetId), P(data.focusId)].filter(Boolean));
  const dlg = openModal(`
    <h2>📥 Geteilter Fund</h2>
    <div class="note" style="font-size:.85rem;max-height:120px;overflow:auto">${pre.image ? '🖼️ Bild (wird nach der Auswahl automatisch gelesen)\n' : ''}${esc([pre.title, pre.text, pre.url].filter(Boolean).join('\n'))}</div>
    <label>Zu welcher Person gehört das?</label>
    <input id="pSearch" type="search" placeholder="🔍 Name suchen …">
    <div id="pList" style="margin-top:8px"></div>
    <div class="actions"><button class="btn wide" id="cancel">Abbrechen</button></div>`);

    const q = dlg.querySelector('#pSearch').value.trim().toLowerCase();
    const hit = q ? list.filter(p => (fullName(p) + ' ' + p.birthName).toLowerCase().includes(q)) : [...new Set(recent.concat(list))];
    dlg.querySelector('#pList').innerHTML = hit.slice(0, 40).map(p => `<div class="row g-${p.gender}" data-pick="${p.id}">${avatarHTML(p)}<div><div class="nm">${esc(fullName(p))}</div><div class="sub">${esc(lifeSpan(p))}</div></div></div>`).join('');
  };
  dlg.querySelector('#pSearch').oninput = draw; draw();
  dlg.querySelector('#pList').onclick = e => { const r = e.target.closest('[data-pick]'); if (r) addFinding(r.dataset.pick, pre); };

}
async function checkShared() {
  const q = new URLSearchParams(location.search);
  const pre = { title: q.get('share_title') || '', text: q.get('share_text') || '', url: q.get('share_url') || '' };
  if (q.get('share_image')) {   // geteiltes Bild aus dem Zwischenspeicher holen
    try {
      const c = await caches.open('stammbaum-share'), key = new URL('shared-image', location.href).href;
      const r = await c.match(key); if (r) { pre.image = await r.blob(); await c.delete(key); }
    } catch (e) {}
  }
  if (!pre.title && !pre.text && !pre.url && !pre.image) return;
  history.replaceState(null, '', location.pathname);
  // Chrome schickt den Link manchmal im Text mit
  if (!pre.url) { const m = pre.text.match(/https?:\/\/[^\s]+/); if (m) { pre.url = m[0]; pre.text = pre.text.replace(m[0], '').trim(); } }
  pickPersonFor(pre);
}

sheet.addEventListener('click', e => {
  const o = e.target.closest('[data-open]'); if (o) return openDetail(o.dataset.open);
  const a = e.target.closest('[data-act]'); if (!a) return;
  const id = sheetId, act = a.dataset.act;
  if (act === 'close') closeSheet();
  else if (act === 'edit') personForm(id);
  else if (act === 'editnotes') editNotes(id);
  else if (act === 'connect') connectPerson(id);
  else if (act === 'mergewith') mergeWithDialog(id);
  else if (act === 'focus') { data.focusId = id; save(); closeSheet(); showTree(); renderTree(true); }
  else if (act === 'root') { data.rootId = id; save(); openDetail(id); }
  else if (act === 'delete') deletePerson(id);
  else if (act === 'research') openResearch(id);
  else if (act === 'finding') addFinding(id);
  else addRelative(id, act);
});

// ---- Datum: verschiedene Schreibweisen erkennen und einheitlich machen ----
const MONTHS_DE = ['januar', 'februar', 'märz', 'april', 'mai', 'juni', 'juli', 'august', 'september', 'oktober', 'november', 'dezember'];
function monthIndex(w) {
  w = w.toLowerCase().replace('ä', 'a').replace(/\.$/, '');
  return MONTHS_DE.findIndex(m => m.replace('ä', 'a').startsWith(w.slice(0, 3)) && w.length >= 3);

function shrinkPhoto(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = 180, c = document.createElement('canvas'); c.width = c.height = s;
      const m = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = rej; img.src = url;
  });
}

// Verwandte hinzufügen: neue Person anlegen oder vorhandene verknüpfen
const KIND = { father: 'Vater', mother: 'Mutter', spouse: 'Partner/in', child: 'Kind', sibling: 'Bruder/Schwester' };
function link(baseId, kind, otherId) {
  const b = P(baseId), o = P(otherId); if (!b || !o || baseId === otherId) return;
  if (kind === 'father') b.father = otherId;
  else if (kind === 'mother') b.mother = otherId;
  else if (kind === 'spouse') {
    if (!b.spouses.includes(otherId)) b.spouses.push(otherId);
    if (!o.spouses.includes(baseId)) o.spouses.push(baseId);
  } else if (kind === 'sibling') {
    if (P(b.father)) o.father = b.father;
    if (P(b.mother)) o.mother = b.mother;
    if (!P(b.father) && !P(b.mother)) {   // Eltern fehlen noch → direkt als Geschwister verbinden
      b.siblings = b.siblings || []; if (!b.siblings.includes(otherId)) b.siblings.push(otherId);
      o.siblings = o.siblings || []; if (!o.siblings.includes(baseId)) o.siblings.push(baseId);
    }
  } else if (kind === 'child') {
    if (b.gender === 'w' || (b.gender !== 'm' && o.father)) o.mother = baseId; else o.father = baseId;
    const sp = b.spouses.filter(P);
    if (sp.length === 1) { if (o.father === baseId && !o.mother) o.mother = sp[0]; else if (o.mother === baseId && !o.father) o.father = sp[0]; }
  }
}
function addRelative(baseId, kind) {
  const b = P(baseId); if (!b) return;
  const preset = {};
  const fam = b.birthName && b.gender === 'w' ? b.birthName : b.lastName;   // Familienname der Eltern
  if (kind === 'father') { preset.gender = 'm'; preset.lastName = fam; preset.status = 'unbekannt'; }
  if (kind === 'mother') { preset.gender = 'w'; preset.lastName = fam; }
  if (kind === 'child') preset.lastName = b.lastName;
  if (kind === 'sibling') preset.lastName = fam;
  if (kind === 'spouse') { preset.gender = b.gender === 'm' ? 'w' : b.gender === 'w' ? 'm' : 'u'; if (b.gender === 'm') preset.lastName = b.lastName; }
  // Wer ein Elternteil oder Partner von jemandem ist, der vor über 110 Jahren geboren wurde, ist sicher verstorben
  const by = yearOf(b.birthDate);
  if (by && by < THIS_YEAR - 110 && kind !== 'child' && kind !== 'sibling') preset.status = 'verstorben';
  const title = `${KIND[kind]} von ${esc(fullName(b))}`;
  const again = kind === 'child' ? { label: 'noch ein Kind', preset } : kind === 'sibling' ? { label: 'noch ein Geschwister', preset } : null;
  const startNew = () => personForm(null, preset, id => link(baseId, kind, id), 'Neu: ' + title, again);
  const others = sortedPersons().filter(p => p.id !== baseId);
  if (!others.length) return startNew();
  const dlg = openModal(`
    <h2>${title}</h2>
    <div class="menu-list">
      <button class="btn primary" id="new">＋ Neue Person anlegen</button>
    </div>
    <label style="margin-top:18px">… oder eine Person verknüpfen, die schon im Stammbaum ist:</label>
    <select id="pick">${personOptions('', baseId)}</select>
    <div class="actions">
      <button class="btn" id="cancel">Abbrechen</button>
      <button class="btn primary" id="ok">🔗 Verknüpfen</button>
    </div>`);
  dlg.querySelector('#new').onclick = startNew;
  dlg.querySelector('#cancel').onclick = closeModal;
  dlg.querySelector('#ok').onclick = () => {
    const v = dlg.querySelector('#pick').value; if (!v) { alert('Bitte eine Person auswählen.'); return; }
    link(baseId, kind, v); save(); closeModal(); refresh(); if (sheetId) openDetail(sheetId);
  };
}

function deletePerson(id) {
  const p = P(id); if (!p) return;
  if (!confirm(`„${fullName(p)}“ wirklich löschen? Die Verbindungen zu anderen Personen werden gelöst.`)) return;
  delete data.persons[id];
  Object.values(data.persons).forEach(o => {
    if (o.father === id) o.father = null; if (o.mother === id) o.mother = null;
    o.spouses = (o.spouses || []).filter(s => s !== id);
    o.siblings = (o.siblings || []).filter(s => s !== id);
  });
  if (data.focusId === id) data.focusId = null; if (data.rootId === id) data.rootId = null;
  save(); closeSheet(); refresh(true);
}

}
