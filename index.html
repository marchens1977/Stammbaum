// Fügt Personen hinzu; Doppelte (gleicher Name + gleiches Geburtsjahr) werden zusammengeführt
function mergePersons(imp) {
  const map = {}; let added = 0, merged = 0;
  const FIELDS = ['firstName', 'lastName', 'birthName', 'birthDate', 'birthPlace', 'deathDate', 'deathPlace', 'occupation', 'notes', 'sources', 'photo'];
  Object.values(imp).forEach(q => {
    const by = yearOf(q.birthDate), dy = yearOf(q.deathDate);
    const twin = Object.values(data.persons).find(x => sameName(x, q) &&
      ((by && yearOf(x.birthDate) === by) || (!by && !yearOf(x.birthDate) && dy && yearOf(x.deathDate) === dy)));
    if (twin) {
      map[q.id] = twin.id; merged++;
      FIELDS.forEach(f => { if (q[f] && !twin[f]) twin[f] = q[f]; });
      if (twin.gender === 'u' && q.gender !== 'u') twin.gender = q.gender;
      if (twin.status === 'unbekannt' && q.status !== 'unbekannt') twin.status = q.status;
    } else {
      const np = Object.assign({}, q, { id: uid(), father: null, mother: null, spouses: [] });
      data.persons[np.id] = np; map[q.id] = np.id; added++;
    }
  });
  Object.values(imp).forEach(q => {
    const t = P(map[q.id]);
    if (q.father && map[q.father] && !P(t.father)) t.father = map[q.father];
    if (q.mother && map[q.mother] && !P(t.mother)) t.mother = map[q.mother];
    (q.spouses || []).forEach(s => { const m = map[s]; if (m && m !== t.id && !t.spouses.includes(m)) t.spouses.push(m); });
  });
  if (!P(data.rootId)) data.rootId = Object.values(map)[0];
  return { added, merged };
}

// ====================== GEDCOM (Austauschformat) ======================
const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
function toGedDate(s) {
  s = (s || '').trim(); let m;
  if ((m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/)) && MON[+m[2] - 1]) return `${+m[1]} ${MON[+m[2] - 1]} ${m[3]}`;
  if ((m = s.match(/^(\d{1,2})\.(\d{4})$/)) && MON[+m[1] - 1]) return `${MON[+m[1] - 1]} ${m[2]}`;
  if ((m = s.match(/^(um|ca\.?|etwa)\s+(\d{4})$/i))) return 'ABT ' + m[2];
  if ((m = s.match(/^vor\s+(\d{4})$/i))) return 'BEF ' + m[1];
  if ((m = s.match(/^nach\s+(\d{4})$/i))) return 'AFT ' + m[1];
  return s;
}
function fromGedDate(s) {
  s = (s || '').trim(); let m;
  const two = n => String(n).padStart(2, '0');
  if ((m = s.match(/^(\d{1,2}) ([A-Za-z]{3}) (\d{4})$/)) && MON.includes(m[2].toUpperCase())) return `${two(m[1])}.${two(MON.indexOf(m[2].toUpperCase()) + 1)}.${m[3]}`;
  if ((m = s.match(/^([A-Za-z]{3}) (\d{4})$/)) && MON.includes(m[1].toUpperCase())) return `${two(MON.indexOf(m[1].toUpperCase()) + 1)}.${m[2]}`;
  return s.replace(/^ABT\b/i, 'um').replace(/^(EST|CAL)\b/i, 'ca.').replace(/^BEF\b/i, 'vor').replace(/^AFT\b/i, 'nach');
}
function exportGedcom() {
  const one = s => String(s || '').replace(/\s*\n\s*/g, ' ');
  const ps = Object.values(data.persons), ix = {};
  ps.forEach((p, i) => ix[p.id] = '@I' + (i + 1) + '@');
  const fams = new Map();
  const fam = (a, b) => {
    const k = [a || '', b || ''].sort().join('|');
    if (!fams.has(k)) fams.set(k, { parents: [a, b].filter(Boolean), children: [], id: '@F' + (fams.size + 1) + '@' });
    return fams.get(k);
  };
  ps.forEach(p => (p.spouses || []).forEach(s => { if (P(s)) fam(p.id, s); }));
  ps.forEach(p => { const fa = P(p.father) ? p.father : null, mo = P(p.mother) ? p.mother : null; if (fa || mo) fam(fa, mo).children.push(p.id); });
  // Geschwister ohne eingetragene Eltern: gemeinsame Familie ohne Eltern (GEDCOM erlaubt das)
  ps.forEach(p => {
    if (P(p.father) || P(p.mother)) return;
    const grp = [p.id].concat(siblingsOf(p).filter(x => !P(x.father) && !P(x.mother)).map(x => x.id));
    if (grp.length < 2) return;
    const k = 'SIB|' + grp.slice().sort()[0];
    if (!fams.has(k)) fams.set(k, { parents: [], children: [], id: '@F' + (fams.size + 1) + '@' });
    const f = fams.get(k); grp.forEach(id => { if (!f.children.includes(id)) f.children.push(id); });
  });
  const L = ['0 HEAD', '1 SOUR UNSER_STAMMBAUM', '1 GEDC', '2 VERS 5.5.1', '2 FORM LINEAGE-LINKED', '1 CHAR UTF-8'];
  const multi = (lvl, tag, text) => String(text).split(/\r?\n/).forEach((ln, i) => L.push(i ? `${lvl + 1} CONT ${ln}` : `${lvl} ${tag} ${ln}`));
  ps.forEach(p => {
    L.push(`0 ${ix[p.id]} INDI`);
    const sur = p.birthName || p.lastName;
    L.push(`1 NAME ${one(p.firstName)} /${one(sur)}/`);
    if (p.firstName) L.push('2 GIVN ' + one(p.firstName)); if (sur) L.push('2 SURN ' + one(sur));
    if (p.birthName && p.lastName && p.birthName !== p.lastName) L.push(`1 NAME ${one(p.firstName)} /${one(p.lastName)}/`, '2 TYPE married');
    L.push('1 SEX ' + ({ m: 'M', w: 'F' }[p.gender] || 'U'));
    if (p.birthDate || p.birthPlace) { L.push('1 BIRT'); if (p.birthDate) L.push('2 DATE ' + toGedDate(one(p.birthDate))); if (p.birthPlace) L.push('2 PLAC ' + one(p.birthPlace)); }
    if (p.deathDate || p.deathPlace) { L.push('1 DEAT'); if (p.deathDate) L.push('2 DATE ' + toGedDate(one(p.deathDate))); if (p.deathPlace) L.push('2 PLAC ' + one(p.deathPlace)); }
    else if (p.status === 'verstorben') L.push('1 DEAT Y');
    if (p.occupation) L.push('1 OCCU ' + one(p.occupation));
    if (p.notes) multi(1, 'NOTE', p.notes);
    if (p.sources) multi(1, 'SOUR', p.sources);
    fams.forEach(f => { if (f.parents.includes(p.id)) L.push('1 FAMS ' + f.id); if (f.children.includes(p.id)) L.push('1 FAMC ' + f.id); });
  });
  fams.forEach(f => {
    L.push(`0 ${f.id} FAM`);
    let [a, b] = f.parents;
    if (b) { if (P(a).gender === 'w' || P(b).gender === 'm') [a, b] = [b, a]; L.push('1 HUSB ' + ix[a], '1 WIFE ' + ix[b]); }
    else if (a) L.push((P(a).gender === 'w' ? '1 WIFE ' : '1 HUSB ') + ix[a]);

}
function importGedcom(text) {
  const lines = text.replace(/^﻿/, '').split(/\r?\n/).map(l => {
    const m = l.trim().match(/^(\d+)\s+(@[^@]+@\s+)?(\S+)(?:\s(.*))?$/);
    return m ? { lvl: +m[1], xref: m[2] ? m[2].trim() : null, tag: m[3].toUpperCase(), val: m[4] || '' } : null;
  }).filter(Boolean);
  const recs = []; let cur = null;
  for (const l of lines) { if (l.lvl === 0) { cur = Object.assign({ kids: [] }, l); recs.push(cur); } else if (cur) cur.kids.push(l); }
  const persons = {}, map = {};
  for (const r of recs.filter(r => r.tag === 'INDI')) {
    const p = newPerson(); map[r.xref] = p.id; persons[p.id] = p;
    let ctx = null, names = 0, txt = null, n2 = null;
    for (const l of r.kids) {
      if (l.lvl === 1) {
        ctx = l.tag; txt = null;
        if (l.tag === 'NAME') {
          names++; const m = l.val.match(/^(.*?)\s*\/(.*?)\/\s*(.*)$/);
          const given = (m ? (m[1] + ' ' + m[3]) : l.val).trim(), sur = m ? m[2].trim() : '';
          if (names === 1) { p.firstName = given; p.lastName = sur; } else { ctx = 'NAME2'; n2 = sur; }
        } else if (l.tag === 'SEX') p.gender = { M: 'm', F: 'w' }[l.val.trim().toUpperCase()] || 'u';
        else if (l.tag === 'DEAT' || l.tag === 'BURI') p.status = 'verstorben';
        else if (l.tag === 'OCCU') p.occupation = l.val;
        else if ((l.tag === 'NOTE' || l.tag === 'SOUR') && !l.val.startsWith('@')) {
          txt = l.tag === 'NOTE' ? 'notes' : 'sources'; if (l.val) p[txt] += (p[txt] ? '\n' : '') + l.val;
        }
      } else if (l.lvl === 2) {
        if (l.tag === 'CONT' && txt) p[txt] += '\n' + l.val;
        else if (l.tag === 'CONC' && txt) p[txt] += l.val;
        else if (l.tag === 'DATE' || l.tag === 'PLAC') {
          const f = l.tag === 'DATE' ? 'Date' : 'Place', v = l.tag === 'DATE' ? fromGedDate(l.val) : l.val;
          if (ctx === 'BIRT' || ((ctx === 'CHR' || ctx === 'BAPM') && !p['birth' + f])) p['birth' + f] = v;
          if (ctx === 'DEAT' || (ctx === 'BURI' && !p['death' + f])) p['death' + f] = v;
        } else if (l.tag === '_MARNM' && ctx === 'NAME') { const v = l.val.replace(/\//g, '').trim(); if (v) { p.birthName = p.lastName; p.lastName = v; } }
        else if (l.tag === 'TYPE' && ctx === 'NAME2' && /married/i.test(l.val) && n2) { p.birthName = p.lastName; p.lastName = n2; }
      }
    }
  }
  for (const r of recs.filter(r => r.tag === 'FAM')) {
    let h = null, w = null; const ch = [];
    r.kids.filter(l => l.lvl === 1).forEach(l => {
      const id = map[l.val.trim()];
      if (l.tag === 'HUSB') h = id; else if (l.tag === 'WIFE') w = id; else if (l.tag === 'CHIL' && id) ch.push(id);
    });
    if (h && w) { if (!persons[h].spouses.includes(w)) persons[h].spouses.push(w); if (!persons[w].spouses.includes(h)) persons[w].spouses.push(h); }
    ch.forEach(c => { if (h) persons[c].father = h; if (w) persons[c].mother = w; });
    if (!h && !w && ch.length > 1) ch.forEach(c => { persons[c].siblings = ch.filter(x => x !== c); });
  }
  return persons;
}

// ====================== Update der App ======================
// Holt die neueste index.html (am Browser-Speicher vorbei) und vergleicht die Versionsnummer „Nr. N“.
// Die Familiendaten liegen getrennt im Browser (localStorage) und bleiben beim Update unverändert.
const versionNo = v => { const m = String(v || '').match(/Nr\.\s*(\d+)/); return m ? +m[1] : 0; };
let lastUpdateCheck = 0;
async function checkUpdate(manual) {
  lastUpdateCheck = Date.now();
  let latest = '';
  try {
    const r = await fetch('index.html?update=' + Date.now(), { cache: 'no-store' });
    const m = (await r.text()).match(/const APP_VERSION = '([^']+)'/); latest = m ? m[1] : '';
  } catch (e) {}
  if (!latest) { if (manual) alert('Konnte nicht nach Updates suchen – bist du mit dem Internet verbunden?'); return; }
  if (versionNo(latest) > versionNo(APP_VERSION)) showUpdateBar(latest);
  else if (manual) alert(`✓ Die App ist aktuell.\n\nVersion ${APP_VERSION}`);
}
function showUpdateBar(latest) {
  if (document.getElementById('updBar')) return;
  const bar = document.createElement('div'); bar.id = 'updBar';
  bar.innerHTML = `<span>🔄 <b>Neue Version Nr. ${versionNo(latest)}</b> ist da.</span>
    <button class="btn" id="updNow">Jetzt aktualisieren</button><button class="updx" id="updLater" aria-label="Später">✕</button>`;
  document.body.appendChild(bar);
  bar.querySelector('#updLater').onclick = () => bar.remove();
  bar.querySelector('#updNow').onclick = installUpdate;
}
async function installUpdate() {
  const b = document.getElementById('updNow'); if (b) { b.disabled = true; b.textContent = 'Wird geladen …'; }
  try {
    save();   // Daten sicher speichern (bleiben ohnehin erhalten)
    // alte App-Dateien aus dem Speicher werfen (nicht das geteilte Bild) und neu holen
    if (window.caches) await caches.delete('stammbaum-v1');
    await Promise.all(['index.html', './', 'sw.js', 'manifest.json'].map(u => fetch(u, { cache: 'reload' }).catch(() => {})));
    if (navigator.serviceWorker) { const reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.update().catch(() => {}); }
  } catch (e) {}

}
// automatisch: beim Start und wenn die App wieder geöffnet wird (höchstens alle 30 Minuten)
if (location.protocol === 'https:') {
  setTimeout(() => checkUpdate(false), 3000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastUpdateCheck > 30 * 60000) checkUpdate(false); });
}
if (/[?&]v=\d+/.test(location.search)) history.replaceState(null, '', location.pathname + location.search.replace(/[?&]v=\d+/, '').replace(/^&/, '?'));
